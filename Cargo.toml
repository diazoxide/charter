[workspace]
resolver = "3"
members = ["crates/charter-core", "crates/charter-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in", "app/src-tauri"]
# Plain `cargo test` and `cargo clippy` cover the crates that need no built frontend.
# The app crate compiles `app/dist` into itself, so it is checked through `npm run tauri`.
default-members = ["crates/charter-core", "crates/charter-cli", "crates/fake-harness", "crates/persona-statistics", "crates/extension-probe", "crates/release-manifest", "crates/changelog", "crates/stand-in"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/diazoxide/charter-app"

[workspace.dependencies]
charter-core = { path = "crates/charter-core" }
# What each release of the app brought: About Charter and the release body both read it.
changelog = { path = "crates/changelog" }
# Test-only: the one way a test writes a program it is about to run (charter-app#81).
stand-in = { path = "crates/stand-in" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
# `deny`, not `forbid`, for exactly one audited block: `executor::inherit_nothing_else`, the
# `pre_exec` that closes every inherited descriptor in an extension's program (the operator,
# 2026-09-23: "Allow one audited block"). `forbid` cannot be allowed anywhere, even there.
# `crates/charter-core/tests/one_unsafe_block.rs` fails the build if `unsafe` or an allow of
# this lint appears anywhere else.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Named rather than left to `all`, so that what the `clippy.toml` files disallow is refused
# and not merely mentioned. It does nothing in a crate with no `clippy.toml` to configure it.
disallowed_methods = "deny"
# The one `unsafe` block says why it is sound, and so would any other.
undocumented_unsafe_blocks = "deny"

# persona-statistics is an extension's program, and charter hashes an extension's whole directory
# and refuses one past 64 MiB (`extension::MOST_TREE_BYTES`). It links charter-core, and on Linux a
# debug build carries every crate's debug info inside the binary, which is past that. Its tests
# run the debug build through the real registry, so the debug build is stripped of debug info,
# as the release build is.
[profile.dev.package.persona-statistics]
strip = "debuginfo"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
