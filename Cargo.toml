[workspace]
resolver = "3"
members = ["crates/charter-core", "crates/charter-cli", "crates/fake-harness", "app/src-tauri"]
# Plain `cargo test` and `cargo clippy` cover the crates that need no built frontend.
# The app crate compiles `app/dist` into itself, so it is checked through `npm run tauri`.
default-members = ["crates/charter-core", "crates/charter-cli", "crates/fake-harness"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/diazoxide/charter-app"

[workspace.dependencies]
charter-core = { path = "crates/charter-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
