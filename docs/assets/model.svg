<svg xmlns="http://www.w3.org/2000/svg" width="900" height="424" viewBox="0 0 900 424"
     role="img" aria-label="A control plane holds an inventory of every repo in the org, a set of personas each with its own memory and vault, and one workspace directory per task; each workspace holds repo clones on their own branches, and a clone can be split further into git worktrees so parallel sub-agents each get their own branch of the same repo.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .t   { fill: #c9d1d9; font-size: 12px; }
    .m   { fill: #8b949e; font-size: 11px; }
    .s   { fill: #6e7681; font-size: 10.5px; }
    .ws  { fill: #58a6ff; font-size: 13px; font-weight: 600; }
    .pe  { fill: #bc8cff; font-size: 12px; }
    .wt  { fill: #39c5cf; font-size: 11px; }
    .br  { fill: #d29922; font-size: 11.5px; }
    .ok  { fill: #3fb950; font-size: 11px; }
    .hd  { fill: #39c5cf; font-size: 13px; font-weight: 600; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="423" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- header -->
  <text class="mono hd" x="24" y="32">⬢ control plane</text>
  <text class="mono m"  x="146" y="32">— any directory marked by charter.toml</text>

  <!-- ── left column ─────────────────────────────────────────────────────── -->
  <text class="mono s" x="24" y="62">inventory/</text>
  <rect x="24" y="70" width="268" height="66" rx="6" fill="#161b22" stroke="#30363d"/>
  <text class="mono t" x="40" y="94">repos.json</text>
  <text class="mono m" x="40" y="112">every repo in the org —</text>
  <text class="mono m" x="40" y="128">including the uncloned ones</text>

  <text class="mono s" x="24" y="166">personas/</text>
  <rect x="24" y="174" width="268" height="140" rx="6" fill="#161b22" stroke="#30363d"/>
  <text class="mono pe" x="40" y="198">devops</text>
  <text class="mono ok" x="200" y="198">✎2</text>
  <text class="mono br" x="232" y="198">●vault</text>
  <text class="mono pe" x="40" y="220">qa</text>
  <text class="mono ok" x="200" y="220">✎1</text>
  <text class="mono br" x="232" y="220">●vault</text>
  <text class="mono pe" x="40" y="242">reviewer</text>
  <text class="mono s"  x="200" y="242">·</text>
  <line x1="40" y1="258" x2="276" y2="258" stroke="#30363d"/>
  <text class="mono s" x="40" y="278">own charter · own memory · own vault</text>
  <text class="mono s" x="40" y="298">sync-agents → .claude/agents/*.md</text>

  <!-- ── right column ────────────────────────────────────────────────────── -->
  <text class="mono s" x="312" y="62">workspaces/  — one directory per task, `charter clone` fills it</text>

  <!-- workspace 1 -->
  <rect x="312" y="70" width="564" height="176" rx="6" fill="#161b22" stroke="#30363d"/>
  <text class="mono ws" x="328" y="94">billing-migration</text>
  <text class="mono s"  x="470" y="94">· 2 todos · vision: cut over without an outage</text>

  <text class="mono t"  x="344" y="120">billing-api</text>
  <text class="mono br" x="500" y="120">migrate/ledger-cutover</text>
  <text class="mono br" x="676" y="120">*</text>
  <text class="mono wt" x="686" y="120">↑2</text>
  <text class="mono t"  x="344" y="140">billing-core</text>
  <text class="mono br" x="500" y="140">migrate/ledger-cutover</text>

  <!-- the clone -> worktree relationship, the one arrow worth drawing -->
  <path d="M334 126 L334 168" stroke="#39c5cf" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M334 172 l-3.5 -6 h7 z" fill="#39c5cf"/>

  <rect x="344" y="156" width="516" height="76" rx="6" fill="#0d1117" stroke="#39c5cf" stroke-opacity="0.45"/>
  <text class="mono wt" x="358" y="176">.worktrees/billing-api/  — one clone, several checkouts</text>
  <rect x="358" y="186" width="240" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text class="mono t" x="372" y="207">schema</text>
  <text class="mono br" x="470" y="207">branch A</text>
  <rect x="612" y="186" width="234" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
  <text class="mono t" x="626" y="207">backfill</text>
  <text class="mono br" x="722" y="207">branch B</text>

  <!-- workspace 2 -->
  <rect x="312" y="262" width="564" height="66" rx="6" fill="#161b22" stroke="#30363d"/>
  <text class="mono ws" x="328" y="286">hotfix-webhook</text>
  <text class="mono t"  x="344" y="312">billing-api</text>
  <text class="mono br" x="500" y="312">fix/webhook-retry</text>

  <!-- ── footer ──────────────────────────────────────────────────────────── -->
  <line x1="24" y1="352" x2="876" y2="352" stroke="#30363d"/>
  <text class="mono m" x="24" y="376">billing-api is up there four times: one clone, two worktrees of that clone, and a</text>
  <text class="mono m" x="24" y="396">separate clone in the other workspace. Four branches checked out at once, no stashing.</text>
</svg>
