# cargo-mutants' configuration, read by `.github/workflows/mutants.yml` and by any local
# `cargo mutants`.
#
# `exclude_re` is for EQUIVALENT mutants only: a change no input can observe, proved at the
# code site in a comment the next reader will be standing on. "Hard to test" is not
# equivalent — a mutant nobody has caught yet belongs in `.github/mutants-survivors.txt`,
# the backlog, where it stays visible. Each entry names its file and function, and never a
# line number, so that an edit above it does not quietly point it at a different mutant.
#
# `exclude_globs` is for TEST PLUMBING only: a file that is `cfg(test)` in spirit — nothing in
# the product calls it — but has to be compiled into the library so charter-core's
# integration tests, which are separate crates, can reach it. cargo-mutants skips `cfg(test)`
# code on its own; this keeps that true for such a file. Product code never goes here.

# `testrun` was `cfg(test)` until charter-app#267 made the integration tests re-run through it.
exclude_globs = ["crates/charter-core/src/testrun.rs"]

exclude_re = [
    # `steer::var`'s `Some(String::new())` against `None`: every caller reads an empty steering
    # variable as unset (`doctor::session::current` filters it, `warn_env_override` falls back
    # to `""`), so no input tells them apart. The site says so.
    'src/steer\.rs:\d+:\d+: replace var -> Option<String> with Some\(String::new\(\)\)$',
    # `now() < deadline` against `now() <= deadline` differs only at the one instant equal to
    # the deadline; the loop polls every 10 ms and no test can land on it. The loop is
    # `git_answer`'s since it was split out of `git_path_state`, which left this entry naming a
    # function the mutant was no longer in.
    'src/profiles\.rs:\d+:\d+: replace < with <= in git_answer$',
    # `commit_at`'s `sha.ok()` guard against `true`: `git rev-parse --short HEAD` writes nothing
    # to stdout when it fails (measured on an unborn branch, where plain `rev-parse HEAD`
    # would echo `HEAD`), so a failed run's first line is the same `""` the other arm returns.
    # Equivalent over git's behaviour rather than its documented contract; the site says so.
    'src/repos\.rs:\d+:\d+: replace match guard sha\.ok\(\) with true in commit_at$',
    # `float_repr`'s sign of an infinity: `value > 0.0` and `value >= 0.0` agree on both
    # infinities, and that branch sees nothing else.
    'src/pyjson\.rs:\d+:\d+: replace > with >= in float_repr$',
    # `float_repr`'s exponent sign in scientific notation, which is only reached with the
    # exponent outside `-4..16`, so never at the `0` where `<` and `<=` differ.
    'src/pyjson\.rs:\d+:\d+: replace < with <= in float_repr$',
    # `is_repo_top_level`'s `!top.ok() || top.line().is_empty()` against `&&`: a run that
    # falls through compares git's first line with the resolved root, and neither a failed
    # `rev-parse --show-toplevel` (nothing on stdout) nor an empty line can equal a real
    # directory. Equivalent over git's behaviour; the site says so.
    'src/scaffold/mod\.rs:\d+:\d+: replace \|\| with && in is_repo_top_level$',
    # `glrefresh::empty` IS `State::default()`, so its `Default::default()` mutant is the
    # function itself.
    'src/glrefresh\.rs:\d+:\d+: replace empty -> State with Default::default\(\)$',
    # `guest::already` slices from `begin + 1` to skip the begin marker; `begin * 1` keeps the
    # marker in the slice, and the filter after it drops the marker either way (it starts
    # with `#`).
    'src/guest\.rs:\d+:\d+: replace \+ with \* in already$',
    # `machine::supported` is `Ok(())` on unix and a refusal only off unix, which no unix
    # build compiles: the one mutant, `Ok(())`, is the unix function itself and a change to
    # code this platform does not build.
    'src/machine\.rs:\d+:\d+: replace supported -> io::Result<\(\)> with Ok\(\(\)\)$',
    # `extension::supported`, for the same reason and in the same shape: `Ok(())` on unix, a
    # refusal only in the `cfg(not(unix))` twin no unix build compiles. The site says so.
    'src/extension\.rs:\d+:\d+: replace supported -> io::Result<\(\)> with Ok\(\(\)\)$',
    # `extension::BuiltIn::none` IS `Self::default()`, so its `Default::default()` mutant is the
    # function itself, as `glrefresh::empty` above. The site says so.
    'src/extension\.rs:\d+:\d+: replace BuiltIn::none -> Self with Default::default\(\)$',
    # `programs::host_pathext` is `None` on unix (`cfg!(unix)`), so its `None` mutant is the
    # function this platform runs and changes only the `PATHEXT` half no unix build takes. Its
    # `Some(Default::default())` mutant is NOT excluded: a unix test sees it. The site says so.
    'src/programs\.rs:\d+:\d+: replace host_pathext -> Option<std::ffi::OsString> with None$',
    # `hookwire/off_unix.rs` is the hook channel's refusals where there is no unix socket, and
    # it is `#[cfg(not(unix))] mod off_unix;` — no unix build compiles one line of it, so no test
    # on the Linux nightly or a Mac can observe a change to it. Moved into a file of its own
    # (#311) so this is one entry that cannot reach the unix half. The file's header says so.
    'src/hookwire/off_unix\.rs:',
    # `worktree::head_of`'s `!sha.ok() || sha.line().is_empty()` against `&&`: a failed
    # `git rev-parse --short HEAD` writes nothing on stdout and a successful one always writes
    # a sha (measured, null-sha HEAD included), so the halves never differ. Equivalent over
    # git's behaviour, as `commit_at` above; the site says so.
    'src/worktree/mod\.rs:\d+:\d+: replace \|\| with && in head_of$',
    # `wiring::names_a_place` is a question only off unix: there `MAIN_SEPARATOR` is `/`, so
    # both halves of the `||` are one test, and every program `resolve_argv` answers with is
    # absolute, so `true` is what it already returns. The site says so.
    'src/wiring\.rs:\d+:\d+: replace \|\| with && in names_a_place$',
    'src/wiring\.rs:\d+:\d+: replace names_a_place -> bool with true$',
    # `guest::wire`'s first pass takes `charter_owned` less the marker, and the second pass
    # registers `charter_owned` whole: with `== MARKER` instead, an owned file's line is
    # listed by the second pass rather than the first, inside the same call. The final block,
    # the rows and the worse of the two passes are the same either way. The site says so.
    'src/guest\.rs:\d+:\d+: replace != with == in wire$',
    # `machine::Store::pin` trims only after an unpin; with `||` it also trims after a pin or
    # after an unpin that changed nothing, and in both of those the store is already inside
    # both bounds, which `trim` leaves as it is. The site says why.
    'src/machine\.rs:\d+:\d+: replace && with \|\| in Store::pin$',
    # `secret cp`'s open flags are single, distinct bits (`WRONLY`, `CREATE`, `NOFOLLOW`,
    # `NONBLOCK`), and XOR of distinct bits IS their OR: `^` for `|` builds the same flags.
    'src/secrets/cmd\.rs:\d+:\d+: replace \| with \^ in (identify_dest|cp_unix)$',
    # `secrets::cmd::strerror`'s and `briefing::strerror`'s `ends_with(')')` against `true`: an
    # OS error's text always ends in the ` (os error N)` it found, so the guard is never false
    # where the pattern matched. Each site says so.
    'src/(secrets/cmd|briefing)\.rs:\d+:\d+: replace match guard text\.ends_with\(.\).\) with true in strerror$',
    # `secrets::cmd::cp_off_unix` is the refusal a non-unix build gives, and no unix build
    # compiles it: a change to it is a change to code this platform does not build.
    'src/secrets/cmd\.rs:\d+:\d+: replace cp_off_unix -> i32 with ',
    # `persona_vault`'s `Some(v) if !v.is_empty()` against `true`: `declared_vault` never
    # answers an empty value (it skips one), and a frontmatter value is already stripped, so
    # the guard only ever sees non-empty text. The site says so.
    'src/secrets/cmd\.rs:\d+:\d+: replace match guard !v\.is_empty\(\) with true in persona_vault$',
    # `secret cp`'s second look, by the descriptor it opens (`stream_opened_as`, through
    # `identify_dest`), is how a macOS `/dev/fd/N` is known for charter's own stream: there it
    # `lstat`s as a regular file on another device. On Linux `/dev/fd/N` is a symlink, refused
    # before the second look, and every file that reaches it opens to the inode it `lstat`ed,
    # so an answer of "no stream" from it is the answer it already gives. The Linux nightly
    # cannot observe these; macOS CI pins them with
    # `cp_refuses_charter_s_own_standard_output_by_identity`. The site says so.
    'src/secrets/cmd\.rs:\d+:\d+: replace stream_opened_as -> Option<&.static str> with None$',
    'src/secrets/cmd\.rs:\d+:\d+: replace identify_dest -> Option<rustix::fs::Stat> with (None|Some\(Default::default\(\)\))$',
    'src/secrets/cmd\.rs:\d+:\d+: replace \| with & in identify_dest$',
    # `cp_unix`'s `| NONBLOCK` as `& NONBLOCK` drops `NOFOLLOW` and `NONBLOCK`, which only a
    # swap between `cp_dest_refusal`'s `lstat` and the `open` can reach. The site says so.
    'src/secrets/cmd\.rs:\d+:\d+: replace \| with & in cp_unix$',
    # `secrets::exec::supervise`'s SIGINT grace loop, `now() < deadline` against `<=`: they
    # differ only at the one instant equal to the deadline, and the loop polls every 10 ms.
    'src/secrets/exec\.rs:\d+:\d+: replace < with <= in supervise$',
    # `secrets::exec::exit_status`: `code <= 0` differs from `code < 0` only at 0, where
    # `(256 + 0) & 0xff` is 0 too, and an exit code is never above 255. The site says so.
    'src/secrets/exec\.rs:\d+:\d+: replace < with <= in exit_status$',
    # `secrets::replace_all`'s early return `from.is_empty() || data.len() < from.len()` against
    # `&&`: a needle longer than the haystack never matches in the loop either, and an empty
    # needle never arrives — `redact`, its only caller, drops empty values first. The site says so.
    'src/secrets/mod\.rs:\d+:\d+: replace \|\| with && in replace_all$',
    # `reference::urlsplit`'s `i > 0` against `>=`: at `i == 0` the candidate scheme is empty,
    # and an empty candidate fails the first-character check that follows. The site says so.
    'src/secrets/reference\.rs:\d+:\d+: replace > with >= in urlsplit$',
    # `executor::supported` is `Ok(())` on unix and a refusal only off unix, which no unix build
    # compiles: its one mutant is the unix function itself, as `machine::supported` above.
    'src/executor\.rs:\d+:\d+: replace supported -> Result<\(\), String> with Ok\(\(\)\)$',
    # `executor::inherit_nothing_else`'s comparisons and arithmetic are the macOS arm, which the
    # Linux nightly does not compile, and Linux's `close_range(...) == 0`, whose `!=` only sends
    # the child to the per-number loop that marks the same descriptors. The doc comment on the
    # function says which of the macOS ones macOS CI pins and which no test can reach. Its
    # whole-body mutant (`with ()`) is not excluded: every platform catches it.
    'src/executor\.rs:\d+:\d+: replace (==|&&|>|<|/) with \S+ in inherit_nothing_else$',
    # `executor::drain`'s two `>` against `>=`: one is an instant on a clock, which is equivalent.
    # The other, the stderr bound, is NOT: `>=` sets `overflowed` at exactly the bound and a
    # command's stderr of exactly that many bytes is refused. A pattern cannot tell the two
    # apart, so both stay excluded, and the bound is pinned by a test instead
    # (`a_command_s_stderr_of_exactly_the_most_charter_passes_on_is_passed_and_one_byte_more_is_not`).
    # Each site says so.
    'src/executor\.rs:\d+:\d+: replace > with >= in drain$',
    # `executor::drain`'s `Instant::now() < by` against `<=`: they differ only at the one instant
    # equal to a command's deadline. The site says so.
    'src/executor\.rs:\d+:\d+: replace < with <= in drain$',
    # `Running::exits_by`'s `waitid` options are single, distinct bits (`EXITED`, `NOHANG`,
    # `NOWAIT`), and XOR of distinct bits IS their OR: `^` for either `|` asks the same thing.
    "src/executor\\.rs:\\d+:\\d+: replace \\| with \\^ in Running<'a>::exits_by$",
    # `executor::ask_within`'s `left.is_zero() || set_write_timeout(..).is_err()` against `&&`:
    # a zero timeout is an error to `set_write_timeout`, so the halves agree. The site says so.
    'src/executor\.rs:\d+:\d+: replace \|\| with && in ask_within$',
    # `harness_plugin::Adapter::pinned`'s default is `&[]`, and `Vec::leak(Vec::new())` is the
    # same empty slice: every caller only iterates what it answers. The site says so.
    'src/harness_plugin\.rs:\d+:\d+: replace Adapter::pinned -> &.static\[Pin\] with Vec::leak\(Vec::new\(\)\)$',
]
