name: release
# Publishes to PyPI via Trusted Publishing (OIDC) — there is no PyPI API token
# anywhere: not in the repo, not in Actions secrets, not on a laptop. PyPI
# verifies GitHub's signed identity claim for this exact repo + workflow +
# environment, so there is no publishing credential to leak.
#
# That moves the question rather than answering it, and this file has to answer
# the moved one: what CAN publish charter is code running inside the `publish`
# job, because the OIDC token is minted there on demand and the claim it carries
# is genuine. Every `uses:` below is therefore pinned to a full commit SHA, with
# the tag it resolved to in a trailing comment. A floating ref — `@v4`, or
# `@release/v1`, which is a BRANCH head and not a tag — is a promise by whoever
# can move it, and moving it is the whole of CVE-2025-30066 (#443).
#
# Bumping a pin: read the diff for the range, then put the new SHA and its tag
# here. Dependabot opens that pull request (`.github/dependabot.yml`); it does
# not merge it. `tests/test_workflows.py` reads these files as YAML — not as lines of
# text — and fails on any ref written here that is not a full commit SHA, an image digest,
# or a file tracked in this repository. `container:`/`services:` count as refs, in both
# shapes GitHub writes an image in: the `image:` mapping and the bare scalar shorthand.
#
# What it does NOT reach is what a pinned action's own tree then names (#473). Pinning
# `owner/action@<sha>` freezes that action's tree; it does not pin the `uses:` lines a
# composite action writes, or the `FROM` a Docker action builds from, and reading those
# needs the network no test in this suite has. So for `publish` — the job holding
# `id-token: write` — that reading is done by a person and written down in
# `.github/publish-closure.json`. BUMPING A PIN IN `publish` MAKES THAT RECORD STALE AND
# THE SUITE RED, with the command to re-read the new tree in the failure message. It is a
# prompt and not a proof: nothing offline can tell a re-reading from a retyped SHA.
#
# At the pins below, exactly one reference in that closure is movable and nothing here can
# pin it: `pypa/gh-action-pypi-publish` builds from `FROM python:3.13-slim`, a Docker Hub
# tag its publisher rewrites, inside the job that can publish charter. Closing THAT means
# vendoring the action or uploading from a `run:` step with the OIDC token — a change to
# how charter releases itself, and it is still open on #473.
#
# Trigger: push a version tag.
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match the version in pyproject.toml — the `guard` job below
# fails the release if they disagree, because PyPI will not let you re-upload
# a version after a mistake.
#
# Retry: run this workflow by hand and name the version you are retrying.
#   gh workflow run release.yml --ref main -f version=0.1.0
#
# That input is not paperwork (#558). The version check used to be gated on
# `startsWith(github.ref, 'refs/tags/v')`, so a `workflow_dispatch` run — which has a
# branch in `github.ref`, not a tag — SKIPPED it, and a skipped step is a green step.
# The retry path therefore carried strictly weaker checks than the path it retries, and
# the check it dropped was the one guarding the irreversible act. Both paths now state
# the version independently of the file being published and are refused when the two
# disagree: the tag on one, this input on the other. Neither is skippable.
#
# And the retry has to be able to repair a release that half-happened, which until #673 it
# could not do at all. `announce` is `needs: publish`, so everything that can fail AFTER
# the irreversible upload sits behind a job PyPI refuses to run twice; the retry re-entered
# `publish`, was rejected for a version PyPI already had, and `announce` was unreachable on
# that version forever. `publish` therefore passes `skip-existing` on THIS trigger and only
# this one — the reasoning is written where the input is set, because it is the one place
# in this file where re-running an irreversible step changes meaning.
#
# Which ref to retry from is a real choice and this file cannot make it. `--ref main` is
# the one to use when the fix is on main — the #665 shape, where `announce` failed for a
# reason still true of the tagged tree — and it works only until main's `pyproject.toml`
# bumps past the version being retried, because `guard` compares the input against the
# tree it is handed. `--ref v<X.Y.Z>` retries the exact tree that published, which is what
# you want for a transient failure and what stays available afterwards. Re-pushing a
# deleted tag is NOT a retry: it arrives here as `push`, gets the strict path, and is
# refused at the upload — deliberately, see `publish`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets a failed release be retried without a new tag
    inputs:
      version:
        description: "The version this run publishes — must equal pyproject.toml, e.g. 0.53.0"
        required: true

permissions:
  contents: read

jobs:
  guard:
    name: Verify the run names the packaged version, and that it has notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned rather than inherited: both steps below run charter itself, which needs
      # 3.11+ for tomllib. The runner's default `python` is a version nobody here chose.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # NO `if:` ON THIS STEP, OR ON ANY STEP IN THIS JOB. A skipped step is a green step
      # in GitHub Actions, so a condition here is a way for the one check standing between
      # a run and an irreversible upload to report success without ever having run. That
      # is #558 exactly, and `tests/test_workflows.py` fails if an `if:` reappears in this
      # job. Whatever a new trigger needs, it is not a condition on the refusal.
      - name: Compare the version this run names against pyproject.toml
        id: version-check
        env:
          # Empty on the tag path, set on the dispatch path. Which one is authoritative is
          # decided below from the event name, not from which one happens to be non-empty,
          # so an input cannot displace the tag on a tag run.
          #
          # `github.event.inputs.version` rather than `inputs.version`: the `inputs`
          # context is documented as available in a workflow triggered by
          # `workflow_dispatch`, and this step also runs on a tag push. `github.event` is
          # defined on every trigger and its missing members render empty, so the tag path
          # cannot fail here on a context that is not there — which would be this workflow
          # breaking at tag push, the failure mode #558 is about, introduced by the fix.
          CLAIMED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          pkg=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          event="${GITHUB_EVENT_NAME:-}"
          case "$event" in
            push)
              ref="${GITHUB_REF_NAME:-}"
              claimed="${ref#v}"
              said="the tag ${ref:-<none>}"
              ;;
            workflow_dispatch)
              input="${CLAIMED_VERSION:-}"
              claimed="${input#v}"
              said="the version input ${input:-<none>}"
              ;;
            *)
              # Fail closed on a trigger nobody taught this check. A third entry under
              # `on:` must arrive here with a way to state its version, not walk past.
              echo "::error::release.yml was triggered by '$event', and this check does not know what that run claims to publish — refusing to publish"
              exit 1
              ;;
          esac
          echo "claimed=$claimed  pyproject=$pkg  (from $said)"
          if [ -z "$claimed" ]; then
            echo "::error::this run did not say which version it publishes ($said) — a workflow_dispatch retry must pass -f version=$pkg — refusing to publish"
            exit 1
          fi
          if [ "$claimed" != "$pkg" ]; then
            echo "::error::this run names $claimed ($said) but pyproject.toml says $pkg — refusing to publish"
            exit 1
          fi
      - name: Refuse to publish a version whose notes cannot be rendered, or would be refused
        run: |
          # The version comes from pyproject, not the tag: it is defined on BOTH trigger
          # paths (a workflow_dispatch retry has no tag to read), and the step above has
          # already refused a run whose stated version disagrees with it — the tag on one
          # path, the `version` input on the other, and on every path it actually ran.
          #
          # And charter is asked rather than the directory globbed, because this is the
          # same call that renders the Release body below. Globbing would be a second
          # answer to one question, free to say yes on a release whose notes come out
          # empty. `charter news --for` exits non-zero when there is nothing to render.
          #
          # It exits non-zero for MORE than that now: an ordering field charter cannot
          # read, or two entries both claiming `lead: true` (#486); a frontmatter key
          # charter does not know, which is where `Security: true` lands (#503); or a file
          # in docs/news that is not an entry at all.
          #
          # And for a third shape, which is why this step is worth more than it was (#665).
          # Rendering was never the failing step: this command exits 0 on a 300,000-
          # character body, because producing the string is what it was asked to do. The
          # claim nobody was making is that the string FITS where announce sends it —
          # GitHub refuses a release body over 125,000 characters outright rather than
          # trimming it, and the announce job below waits on publish — so that refusal
          # would land after an upload PyPI will not take back, on a path the documented
          # workflow_dispatch retry cannot re-reach. charter now bounds the body it renders and
          # refuses one it cannot bound, so the failure arrives HERE — ahead of test, build
          # and publish — instead of at the one point in this workflow with no way back.
          #
          # The assertion lives in the command rather than in a step of its own precisely
          # because this step and announce run the same command against the same tree: a
          # second copy of the limit in shell would be a second answer to one question, and
          # it is the announce-side answer that decides whether the release exists.
          #
          # So the annotation names the three SHAPES — no entry; something the entries
          # declare that charter cannot honour; or a body GitHub would refuse — and defers
          # to the command's own stderr for which, since that stderr is already one
          # sentence per finding. `>/dev/null` keeps it, dropping only stdout. Prescribing
          # `news stamp` for any shape but the first would be prescribing a no-op for a
          # failure stamping cannot fix.
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if ! python -m charter news --for "$version" >/dev/null; then
            echo "::error::the release notes for $version are not publishable: either no docs/news/$version-<slug>.md (every published version ships an entry, including a patch — run: charter news stamp $version), or something those entries declare that charter cannot honour — an ordering, a frontmatter key, or a file in docs/news that is not an entry — or a body GitHub would refuse as too long, which is a failure this step exists to catch before the upload rather than after it. See the error above for which."
            exit 1
          fi

  test:
    name: Suite must be green before release
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: pipx run build
      - name: Validate metadata renders on PyPI
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/charter-cp
    permissions:
      # A job-level `permissions:` REPLACES the workflow's, it does not add to it — so
      # this line is the whole grant: `contents` is `none` here, not the `read` above.
      # That is deliberate and must stay. This job never checks the repository out; it
      # downloads the artifact `build` produced, which `actions/download-artifact` reads
      # from the same run with the runtime token, needing no `GITHUB_TOKEN` scope at all.
      id-token: write        # REQUIRED: mints the OIDC token PyPI verifies
    # Every remote `uses:` this job reaches — the steps below, and anything a local action
    # of theirs names in turn — has a reading of its own tree in
    # `.github/publish-closure.json`, because this is where a pinned action's own refs run
    # beside the identity that can publish charter. Moving a SHA below without re-reading
    # the tree it now names reddens `tests/test_workflows.py`; adding a step here without
    # a record does the same. The header explains why that is a prompt and not a proof.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # ON THE RETRY TRIGGER, AND ONLY THERE (#673).
          #
          # A `workflow_dispatch` run is not here to publish. It is here to FINISH a
          # publish that may already have happened, because `announce` — the job that
          # creates the GitHub Release — waits on this one. Without this input that retry
          # re-enters this step, hands PyPI a version it already holds, is rejected, and
          # `announce` is unreachable on that version forever. The only exit left is the
          # one `personas/release/persona.md` forbids: writing the Release body by hand,
          # which forks the published notes from the entry that is their single source.
          #
          # "PyPI already holds these files" is the EXPECTED state on that path, not a
          # fault, and the run cannot check it by comparing bytes either. `docs/news/`
          # ships inside the sdist, so the #665 recovery — fix the entry, re-dispatch —
          # rebuilds a different sdist by construction, and `--ref main` picks up whatever
          # else merged besides. PyPI keeps what it has. That is what makes a version one
          # immutable thing, and it is the right outcome: this run's business is the
          # Release, not the artifacts.
          #
          # NOT `true`, and the asymmetry is the whole of the decision. On the tag path a
          # version PyPI already holds has one realistic cause: a tag deleted and re-pushed
          # over a changed tree with the version not bumped — which is exactly what gets
          # reached for when a release went wrong. Unconditionally, that run skips every
          # file, reaches `announce`, finds the Release already there, leaves it as it
          # stands, and reports GREEN having shipped nothing, while
          # `pip install charter-cp==<that version>` still serves the old code. Scoped like
          # this it fails here instead, loudly and correctly: PyPI cannot take the new
          # bytes, and the answer is a patch version rather than a retry.
          #
          # So the discriminator is which trigger asked, because it is the only honest one
          # available — see above, a legitimate retry rebuilds different bytes, so nothing
          # in the artifacts distinguishes the two. A third entry under `on:` renders this
          # `false` and gets the strict path; that is the safe default and
          # `tests/test_a_half_finished_release_can_be_finished.py` asserts it rather than
          # trusting it. An `if:` on this step or this job would be the other shape of the
          # same idea and is refused: a skipped step is a green step, which is #558.
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  announce:
    name: Create the GitHub Release from the shipped news entry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # On this job alone. The workflow's top-level grant stays `contents: read`, so
      # `test` and `build` — which run the repository's own code — never hold write.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Publish the notes charter already ships
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Written out rather than inherited. Actions runs `run:` under `bash -e`, so this
          # step already aborted on a failed command — but "the render refuses and the
          # release is therefore not created" is load-bearing now (#665), and a property
          # that holds because of a platform default is a property nobody in this file
          # states. `guard` spells it out for the same reason. `-u` besides: every variable
          # read below is one this workflow sets, and an empty `$tag` is a `gh release
          # create` against whatever it decides that means.
          set -eu
          version=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="v$version"
          # `workflow_dispatch` re-runs a release that failed somewhere, and the publish
          # may well have been the part that worked. An existing Release is left exactly
          # as it stands — overwriting one is not this job's business, and additive-only
          # is the rule everywhere else charter writes.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists — leaving it as it stands"
            exit 0
          fi
          # Generated, never written here. The entry in docs/news is the single source
          # for both the public notes and the offline `charter news` suggestion, so the
          # two cannot drift: one is printed from the other.
          python -m charter news --for "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
