name: release

# The build a person installs and double-clicks.
#
# `ci.yml`'s `app` job proves the app COMPILES on both platforms; it builds `--debug
# --no-bundle`, so it produces nothing anyone can run. This workflow is the only place that
# uses the release profile and the only place Tauri's bundler runs. Everything it makes is
# UNSIGNED — see "M4" below for what has to be added before anyone but the operator installs
# it, and read the run's job summary for what to type to get past Gatekeeper meanwhile.
#
# `workflow_dispatch` is the operator asking for a build of a branch, on demand. A `v*` tag is
# what M4 cuts a public release from: the same job, with the signing steps filled in.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  # No `cancel-in-progress`: a cancelled release build leaves nothing to download, and two of
  # them racing costs runner minutes and nothing else.
  group: release-${{ github.ref }}

permissions:
  contents: read
  # M4 — creating the GitHub Release a tag publishes, and putting the updater's `latest.json`
  # beside the bundles, needs `contents: write` here. It is `read` while nothing is published.

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT `RUSTFLAGS: -D warnings`, which ci.yml sets. Warnings are gated on every
  # PR; a new warning out of a dependency must not be the thing that stops the operator
  # getting a build they can run.

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # Neither platform's bundle is worth losing because the other one broke.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (.app, .dmg)
            # `app` is the bundle itself and always has to work. `dmg` is a nicety whose
            # bundler drives Finder through AppleScript on a machine with nobody logged in,
            # so it is built separately and allowed to fail.
            bundles: app
            extra_bundles: dmg
          - os: ubuntu-24.04
            name: Linux (.deb, AppImage)
            # `deb` is plain `ar` + `tar` and is reliable. `appimage` downloads linuxdeploy at
            # build time, so it is the one that breaks when something upstream moves.
            bundles: deb
            extra_bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: What this build is called
        id: names
        run: |
          set -euo pipefail
          triple=$(rustc -vV | sed -n 's/^host: //p')
          case "$triple" in
            aarch64-apple-darwin) slug=macos-arm64 ;;
            x86_64-apple-darwin) slug=macos-x86_64 ;;
            x86_64-unknown-linux-gnu) slug=linux-x86_64 ;;
            aarch64-unknown-linux-gnu) slug=linux-arm64 ;;
            *) slug=$triple ;;
          esac
          echo "triple=$triple" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "artifact=charter-$slug-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # The `charter` binary hooks run, built with the same profile and shipped INSIDE the
      # bundle. The app looks for it beside its own executable and deliberately ignores PATH
      # (`charter_binary()` in app/src-tauri/src/lib.rs): the charter on PATH may be an older
      # install or the Python one, and a hook pointed at either answers a different program's
      # idea of these events. An app launched from Finder has no shell PATH to read anyway, so
      # without this every chat in the shipped app would sit at `unknown` forever.
      - name: The charter binary the app's hooks run
        run: cargo build --release --locked -p charter-cli

      - name: Stage it where Tauri's bundler picks it up
        run: |
          set -euo pipefail
          mkdir -p app/src-tauri/binaries
          cp target/release/charter "app/src-tauri/binaries/charter-${{ steps.names.outputs.triple }}"

      # `tauri.release.conf.json` adds only `bundle.externalBin`, so what ships is the app
      # `tauri.conf.json` describes — same identifier, same CSP, same window, same
      # capabilities. It is a separate file for the same reason `tauri.e2e.conf.json` is: the
      # sidecar does not exist in a plain checkout, and ci.yml's `app` job has to keep
      # building without anyone staging one.
      #
      # No `--debug`, so this is the release profile. No `--features e2e`: that feature puts a
      # WebDriver server inside the app and belongs in no build anyone is given.
      - name: Build the app
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
        # M4 — signing and notarization go HERE, as `env:` on this step. Tauri's bundler does
        # the whole of it when these are set and skips it in silence when they are not, which
        # is exactly why they are not wired to empty secrets today: a half-wired signing step
        # produces an unsigned build that everyone downstream reads as signed.
        #   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY;
        #            for notarization APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID, or
        #            APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_PATH.
        #   updater: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) makes the bundler write the
        #            `.sig` beside each artifact. It needs `plugins.updater.pubkey` in
        #            tauri.conf.json and the updater plugin in the app crate first — neither
        #            exists yet, and the key alone signs nothing.
        # Until all of that lands, every artifact here is unsigned and every message says so.

      # Both targets, not just the extra one: Tauri DELETES a bundle it had to build only as
      # an intermediate. Asking for `dmg` alone builds `charter.app`, wraps it, then prints
      # "Cleaning .../bundle/macos/charter.app" and removes it — which is how the first run of
      # this workflow lost the .app it had already built. Naming both keeps both.
      - name: Build the extra bundle
        id: extra
        continue-on-error: true
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }},${{ matrix.extra_bundles }}

      # `.app` is a DIRECTORY, and actions/upload-artifact zips what it is given with a zip
      # that drops the executable bit. An operator unpacking that gets a bundle macOS refuses
      # to launch, with no useful error anywhere. `ditto -c -k` writes the archive Apple's own
      # tools read back, permissions and all, so what is uploaded is already a single file.
      - name: Collect what was built (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/release/bundle/macos/charter.app dist/charter.app.zip
          cp target/release/bundle/dmg/*.dmg dist/ 2>/dev/null || echo "no .dmg — its bundler failed, see the step above"
          ls -l dist

      - name: Collect what was built (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/bundle/deb/*.deb dist/
          cp target/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || echo "no AppImage — its bundler failed, see the step above"
          ls -l dist

      # Honest evidence for "does this start on a machine with no developer tools". It cannot
      # prove it — every runner here has Xcode — but a binary that links only what ships with
      # the OS cannot be missing a developer-tools library. Printed, never hidden.
      - name: What the built app links against
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            bundle=target/release/bundle/macos/charter.app
            # Read the executable's name rather than assuming it: Tauri takes it from the
            # cargo binary name unless `mainBinaryName` overrides, and the whole sidecar
            # scheme depends on it NOT being `charter`.
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
            echo "### $bundle/Contents/MacOS (CFBundleExecutable is '$exe')"
            ls -l "$bundle/Contents/MacOS"
            echo
            echo "otool -L of the app:"
            otool -L "$bundle/Contents/MacOS/$exe"
            echo
            echo "otool -L of the charter binary its hooks run:"
            otool -L "$bundle/Contents/MacOS/charter"
            echo
            echo "codesign of the bundle (expect unsigned, or ad-hoc from the linker):"
            codesign -dv --verbose=2 "$bundle" 2>&1 || true
          else
            echo "### what the .deb ships"
            # No leading slash: dpkg -c prints paths as `usr/bin/charter`, not `/usr/bin/…`.
            dpkg -c dist/*.deb | grep -E 'usr/bin/|\.desktop' || true
            echo
            echo "ldd of the app:"
            ldd target/release/charter-app || true
          fi

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          # Long enough to stay useful across a couple of months of M2 work.
          retention-days: 90

      - name: What the operator types to run it
        if: always()
        env:
          ARTIFACT: ${{ steps.names.outputs.artifact }}
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.name }} — \`$ARTIFACT\`"
            echo
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`, **release profile, unsigned**."
            echo
            echo "Download it from the **Artifacts** section at the bottom of this run's page."
            echo "GitHub hands you \`$ARTIFACT.zip\`; everything below starts from that file in \`~/Downloads\`."
            echo
            echo '```sh'
            echo "cd ~/Downloads"
            echo "unzip -o $ARTIFACT.zip -d $ARTIFACT"
            echo "cd $ARTIFACT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUNNER_OS" = "macOS" ]; then
            dmg=$(cd dist && ls *.dmg 2>/dev/null | head -1 || true)
            {
              echo ""
              echo "# charter.app.zip is a ditto archive; unpack it with ditto, not Finder"
              echo "ditto -x -k charter.app.zip ."
              echo ""
              echo "# This build is not signed and not notarized. macOS flags anything that"
              echo "# came from the internet as quarantined, and Gatekeeper answers an unsigned"
              echo "# quarantined app with a dialog that offers no way past it. Stripping the"
              echo "# flag is what makes it launch:"
              echo "xattr -dr com.apple.quarantine charter.app"
              echo ""
              echo "open charter.app"
              echo '```'
              echo ""
              echo "To keep it: \`mv charter.app /Applications/\` — before the \`xattr\` line, or run \`xattr\` again after."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$dmg" ]; then
              {
                echo ""
                echo "Or from the disk image (same app, same quarantine flag):"
                echo ""
                echo '```sh'
                echo "hdiutil attach $dmg"
                echo "cp -R /Volumes/charter/charter.app /Applications/"
                echo "hdiutil detach /Volumes/charter"
                echo "xattr -dr com.apple.quarantine /Applications/charter.app"
                echo "open /Applications/charter.app"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "_No \`.dmg\` in this run — its bundler failed; the \`.app\` above is unaffected._" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            deb=$(cd dist && ls *.deb 2>/dev/null | head -1 || true)
            img=$(cd dist && ls *.AppImage 2>/dev/null | head -1 || true)
            # Read the app's command from the package rather than assuming it: Tauri takes it
            # from the cargo binary name, and `charter` is the sidecar, not the app.
            appbin=$(dpkg -c "dist/$deb" 2>/dev/null | grep -o '[[:space:]]usr/bin/[^/][^/]*$' | sed 's|.*/||' | grep -v '^charter$' | head -1 || true)
            {
              echo ""
              echo "# the .deb also puts \`charter\`, the binary hooks run, on PATH"
              echo "sudo apt install ./$deb"
              echo "${appbin:-charter-app}"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$img" ]; then
              {
                echo ""
                echo "# or install nothing (the zip drops the executable bit, hence chmod)"
                echo "chmod +x $img"
                echo "./$img"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            {
              echo '```'
              echo ""
              echo "Needs \`libwebkit2gtk-4.1-0\`: the \`.deb\` declares it, the AppImage carries it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "**Unsigned.** Nothing here is code-signed, notarized or updater-signed — M4 adds that."
            echo "Do not hand these files to anyone who would take them for a release."
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so a build that is wrong is still downloadable and still says it is wrong. The
      # app resolves the binary its hooks run as `<the directory of my own exe>/charter`. A
      # missing sidecar leaves every chat in this build at `unknown` with no hook ever firing;
      # a sidecar that IS the app's own executable makes every hook launch a second GUI. Both
      # are invisible until someone runs it, so they are checked here.
      - name: The charter binary really is beside the app, and is not the app
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Listed ONCE into a variable, and every check reads it as a here-string. Piping
            # `dpkg -c` into `grep -q` makes grep exit at the first match and close the pipe,
            # dpkg-deb dies of SIGPIPE, and `pipefail` then reports the whole pipeline as
            # failed — so the check fails loudly on a .deb that is perfectly correct. It did
            # exactly that in run 35511509471.
            listing=$(dpkg -c dist/*.deb)
            echo "the .deb ships:"
            # `dpkg -c` prints `usr/bin/charter`, with no leading slash and no `./`.
            grep '[[:space:]]usr/bin/' <<<"$listing" || true
            grep -q '[[:space:]]usr/bin/charter$' <<<"$listing" \
              || { echo "FAIL: no usr/bin/charter in the .deb — no hook would ever fire"; exit 1; }
            # Two of them: the app and the sidecar. One means the names collided and the
            # bundler wrote one over the other. `[^/][^/]*$` rather than `[^/]*$` so the
            # `usr/bin/` DIRECTORY entry, which ends in a slash, is not counted as a binary.
            n=$(grep -c '[[:space:]]usr/bin/[^/][^/]*$' <<<"$listing" || true)
            [ "$n" -ge 2 ] || { echo "FAIL: only $n binary in usr/bin — the sidecar IS the app"; exit 1; }
            exit 0
          fi
          bundle=target/release/bundle/macos/charter.app
          dir=$bundle/Contents/MacOS
          exe=$dir/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")
          test -x "$dir/charter" || { echo "FAIL: no executable charter beside the app in $dir"; exit 1; }
          test -x "$exe" || { echo "FAIL: CFBundleExecutable names a file that is not there: $exe"; exit 1; }
          [ "$(shasum -a 256 "$dir/charter" | cut -d' ' -f1)" != "$(shasum -a 256 "$exe" | cut -d' ' -f1)" ] \
            || { echo "FAIL: the sidecar IS the app — every hook would launch the GUI"; exit 1; }
          "$dir/charter" --version
