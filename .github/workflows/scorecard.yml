name: scorecard

# The OpenSSF Scorecard grades this repository's supply-chain practice: pinned actions, token
# permissions, branch protection, signed releases and the rest (#585).
#
# **Evidence only (V70).** It reports and never gates: it runs weekly and by hand, never on a
# pull request, and no branch protection names it.
#
# **The score stays in the repository (V38).** Its SARIF report goes to this repository's code
# scanning and to the run's artifacts. `publish_results` is false, so nothing is sent to the
# public OpenSSF API and no badge exists: the first releases are quiet, for internal testing.
# Publishing later is `publish_results: true` plus `id-token: write` on the job, which the
# action needs to prove the run is this repository's.
#
# `crates/release-manifest/tests/the_scorecard_runs_weekly_with_least_privilege.rs` holds this
# file to those rules.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# Nothing by default: the one job below names exactly what it needs.
permissions: {}

jobs:
  analysis:
    name: scorecard (evidence only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only what the analysis needs: read the repository and its workflow runs, and write its
    # report into code scanning.
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Score the repository
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Keep the report with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30

      - name: Show the findings in code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
