name: mutants

# Mutation testing never gates a PR (spec decision 19). It runs on the core crate alone —
# nightly on what changed, weekly on one slice of everything — and this file is about what its
# RED means.
#
# It meant nothing for five consecutive nights. 2026-09-19 through 2026-09-21 all failed and
# roughly fifty PRs merged past the red X, because "failure" was the answer to four different
# questions at once. Measured from run 35580456628's own artifacts, 2026-09-21:
#
#   * purlis-core generates 6,555 mutants (1,639 per shard, four shards).
#   * A mutant costs 34.6 s on average — about 19 s to rebuild the crate and 45 s to run its
#     tests — measured over the 1,868 that finished. The whole crate is therefore ~63 HOURS
#     of serial work, and a quarter of it is ~15.8 h against a job limit of 6.
#   * So shards 0, 1 and 3 were killed by GitHub at exactly 6 h 00 m with 41%, 29% and 44% of
#     their lists tested, and appeared as `cancelled`.
#   * Shard 2 died at 23 minutes to "The runner has received a shutdown signal" — a real
#     eviction, nothing to do with the budget.
#   * The night before, shard 3 failed in 75 seconds because ONE timing-bound test
#     (`a_git_that_refuses_the_repository_is_not_taken_for_one_that_found_none`, 30.01 s
#     against `worktree::git`'s 30 s READ deadline) failed in the UNMUTATED tree, so
#     cargo-mutants tested nothing at all and said so in a line nobody read.
#   * And underneath all of it, three genuinely surviving mutants in `pypath::realpath`.
#
# Four causes, one colour. The changes below give each one its own answer, and the fourth
# keeps the answer affordable:
#
# 1. **The budget fits.** Shards of at most `PER_SHARD` mutants (below), round-robin so no
#    shard inherits a slow file, as many as the run needs — `plan` counts them, so the shard
#    count cannot go stale the way a fixed one did (24 shards sized on 2026-09-22 for 6,632
#    mutants were already 337 apiece by 09-23, when the crate had 8,085: 4 h 40 m against a
#    5 h timeout).
#    Measured from run 35837846519's artifacts (2026-09-23, 322 mutants over three shards):
#    42.7 s a mutant — 23 s to build, 20 s to test, because a caught mutant usually stops at
#    the first failing test binary. The longest test phase of any mutant that was not a
#    TIMEOUT was 64.5 s, which is the whole suite: a missed mutant runs every binary. 200
#    mutants is therefore ~2 h 20 m a shard against the 300-minute step timeout below.
#    The whole suite is also ~28 s shorter than it was on that night: one test waited out a
#    real 30 s git deadline on every mutant, and now waits 2 s
#    (`profiles::ignore_check_within`).
#    Sizing is a measurement and it WILL go stale. The `incomplete` verdict below is what says
#    so, in words, instead of a job vanishing at the platform limit.
#    It went stale on 2026-09-25 (run 36115292771, 13 shards of ~188): shards 0 and 7 were cut
#    at 300 minutes with 97% done and nine more finished between 4 h 34 m and 4 h 58 m. A mutant
#    cost 97 s, not 43: the build had grown to 42 s, and a mutant no test catches runs the
#    whole suite, which had grown to 119-146 s, 79 s of it one test
#    (`the_recorded_plane_root_cases_answer_what_the_python_answered`, 1,912 recorded cases
#    that each ask git). One mutant in five survived that night, so survivors were half of
#    every shard's time. 120 mutants at 97 s is ~3 h 15 m, and leaves room for a worse night.
#    That one test was then cut to about a quarter of its time (#464): its git probes repeat
#    across rows (5,641 operand probes over 230 distinct ones, 3,413 target probes over 188,
#    1,912 default-branch probes over 6 roots), and each distinct one is now asked once. 25 s
#    to 6 s on a 14-core laptop; `PER_SHARD` is left where it is until a night measures it.
#    A night measured it on 2026-10-03 (run 37112271904, 19 shards of ~116): 131 s a mutant
#    on average, but 164 s on the slowest shard, whose build alone took 90-120 s a mutant.
#    Shards 2 and 10 were cut at 300 minutes with 89 and 109 of 116 done, and the rest took
#    3 h 12 m to 4 h 22 m. 80 mutants at 164 s is ~3 h 40 m, so the slowest shard finishes
#    with over an hour to spare. Eight more shards of that run lost their runners to "The
#    runner has received a shutdown signal" 32 minutes to 3 h 20 m into their jobs, which no
#    budget prevents; a smaller shard loses less when it happens.
# 2. **The baseline is checked ONCE.** With a per-shard baseline, 24 shards is 24 rolls of
#    the same flaky dice: three separate deadline-bound tests were caught failing an
#    unmutated purlis-core while this was being written. One job asks the question, every
#    shard runs `--baseline skip`, and a red `baseline` job means "purlis-core's own tests do
#    not pass", which is a different sentence from anything mutation testing says.
# 3. **Survivors are reported by a different job from the one that runs the shards.** So:
#
#        baseline   red  ->  purlis-core's own tests do not pass. Nothing else is evidence.
#        core (N)   red  ->  shard N's run did not finish. The runner, or the budget.
#        survivors  red  ->  purlis-core has code that no test distinguishes. READ IT.
#
#    Only the last one is mutation testing talking. `tools/mutants-report.py` decides which by
#    comparing each shard's planned list (`mutants.json`) against what it actually finished
#    (`outcomes.json`), rather than by reading an exit code that conflates them.
#
# 4. **Nightly tests what changed; Sunday tests everything.** At 8,085 mutants and ~43 s
#    each the whole crate is ~96 runner-HOURS, which at eight runners wide (see `max-parallel`)
#    is ~12 h of wall clock — every day, eight of the account's twenty job slots from 03:17
#    UTC into the afternoon. So Monday to Saturday run `cargo mutants --in-diff` on the diff of
#    `crates/purlis-core` since the head of the last GREEN run of this workflow: measured on
#    2026-09-23, one day of purlis-core's churn is ~1,500 mutants, ~2 h at eight wide. With no
#    green run in the last 72 hours it takes the last 24 hours instead of a diff that grows into
#    a whole-crate run every night the survivors stay red.
#    What the diff cannot see — a deleted test that stops catching an UNCHANGED line — is what
#    Sunday is for, and a clean diff night never closes the issue below.
#
# 5. **Sunday tests one slice of the crate, not all of it** (#1200). By 2026-10-03 purlis-core
#    had 21,035 mutants: at 131 s each that is ~765 runner-hours, ~96 h of wall clock at eight
#    wide, and the last full run (2026-09-27, run 36308723145) ran 37 h without finishing. A
#    full run that never finishes never closes the issue. So Sunday tests slice `W mod SLICES`
#    of the crate, `W` being the weeks since the Unix epoch: whole files in path order, cut to
#    about the same number of mutants each (`tools/mutants-report.py slice`). With SLICES=13 a
#    slice was 1,550-1,771 mutants on 2026-10-05 (21,192 in all): at most 23 shards of
#    `PER_SHARD`, three waves of eight, and at the slowest shard's 164 s a mutant ~11 h, well
#    inside the day before Monday's diff night. Thirteen weeks is a quarter: every file is
#    tested at least once a quarter. When a slice outgrows three waves the run still finishes,
#    a wave later; the fix then is a larger SLICES, never more shards at once (that spends the
#    account's job slots, and is the operator's call).
#    The issue records which FILES are not known clean. A night that is not clean adds what it
#    tested; a slice that runs clean clears only its own files; the issue closes when none is
#    left, which only a full cycle of clean slices can do. `workflow_dispatch` can still ask
#    for the whole crate, but a dispatched run never touches the issue (`notice` runs on
#    `schedule` only), so its answer is on its own run page.
#
# 6. **Every mutant builds without debug info** (`[profile.mutants]` in `Cargo.toml`, chosen by
#    `profile = "mutants"` in `.cargo/mutants.toml`, as the cargo-mutants book recommends). On
#    2026-10-03 the build was 90-120 s of a mutant's 131 s, and most of a build is linking
#    purlis-core's test binaries, whose debug info no mutation verdict reads.
#
# And because the real failure here was that nobody LOOKED for five days, the last job keeps
# one issue in this repo up to date with the answer, and closes it when every file it holds
# has run clean again.
# The run's own summary page carries the survivor table; the issue carries the link.
#
# Note there is deliberately no `RUSTFLAGS: -D warnings` here, unlike `ci.yml`. cargo-mutants
# builds each mutant with the crate's lints, and a denied warning turns a mutant that compiles
# into an `unviable` one that proves nothing. One of the three survivors found on 2026-09-21
# was `while part_count >= 0` on a `usize`, which `unused_comparisons` would have suppressed
# under `-D warnings` — and it was a real finding.

on:
  schedule:
    # Monday to Saturday: what changed since the last green run.
    - cron: "17 3 * * 1-6"
    # Sunday: this week's slice of the crate. `plan` tells the two apart by this exact string.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "diff (since the last green run), slice (this week's slice) or full (the whole crate, days)"
        type: choice
        options: [diff, slice, full]
        default: diff

permissions:
  contents: read

# One nightly at a time, and never cancel one in flight: a run that took four hours and is
# nine tenths done is worth more than a fresher one that has not started.
concurrency:
  group: mutants
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The most mutants one shard is given. `plan` divides the run's count by this, and that
  # one number becomes the matrix, the `--shard N/K` denominator, and the count of verdicts
  # the report checks it received — so a drift between them is visible rather than a silent
  # hole in the coverage.
  PER_SHARD: "80"
  # `cargo mutants --timeout`, in seconds: how long one mutant's tests may run. The `core` step
  # below says how it was sized. `survivors` reads it too, to tell a mutant that hung the suite
  # (caught) from one that outran a suite cut short (not known to be caught).
  MUTANT_TIMEOUT: "240"
  # The weekly slice's cron line, as `github.event.schedule` reports it.
  SLICE_CRON: "17 3 * * 0"
  # How many weekly slices cover the whole crate. Point 5 at the top says how it was sized; a
  # change restarts no clock, because the issue records files, not slices.
  SLICES: "13"
  # Pinned on purpose. An unpinned tool in a nightly changes its own answers, and "the
  # nightly went red" then has one more possible cause. 27.1.0 is what ran on 2026-09-21 and
  # what the sizing above was measured against.
  MUTANTS_VERSION: "27.1.0"

jobs:
  plan:
    # Which mutants tonight tests, and how many shards that takes. The one job that decides
    # the run's SHAPE, so every later job reads the same answer.
    name: what this run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # No cache: `--list` reads the source and `cargo metadata`, and builds nothing.
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-mutants@${{ env.MUTANTS_VERSION }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          ASKED: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            SCOPE="${ASKED:-diff}"
          elif [ "$SCHEDULE" = "$SLICE_CRON" ]; then
            SCOPE="slice"
          else
            SCOPE="diff"
          fi

          if [ "$SCOPE" = diff ]; then
            # The head of the newest green run of this workflow — full or diff, since either
            # means everything up to that commit was tested clean against the backlog — if
            # it is at most 72 hours old and still in main's history.
            SINCE="$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
            BASE="$(gh run list --workflow mutants.yml --status success --limit 50 \
              --json headSha,createdAt \
              --jq "[.[] | select(.createdAt >= \"$SINCE\")][0].headSha // \"\"")" || BASE=""
            if [ -n "$BASE" ] && git merge-base --is-ancestor "$BASE" HEAD; then
              WHY="since the last green run of this workflow, at $BASE"
            else
              BASE="$(git rev-list -1 --before='24 hours ago' HEAD)"
              WHY="over the last 24 hours only, at $BASE: there is no green run of this workflow in the last 72 hours to diff against"
            fi
            if [ -z "$BASE" ]; then
              SCOPE="full"
              WHY="of the whole crate: there is no commit 24 hours old to diff against"
            fi
          fi

          # Every mutant of the crate, and so every file that has one: `notice` keeps its record
          # of what is not known clean in these files.
          cargo mutants --package purlis-core --list > mutants.all
          cut -d: -f1 mutants.all | sort -u > mutants.files
          : > mutants.diff
          if [ "$SCOPE" = diff ]; then
            # `-M` and the old path: a file that only moved (crates/charter-core, RN-13) is not new.
            git diff -M "$BASE" HEAD -- crates/purlis-core crates/charter-core > mutants.diff
            # An empty diff lists nothing (cargo-mutants says so on stderr and exits 0).
            cargo mutants --package purlis-core --in-diff mutants.diff --list > mutants.run
            cut -d: -f1 mutants.run | sort -u > mutants.tested
          elif [ "$SCOPE" = slice ]; then
            WEEK=$(( $(date -u +%s) / 604800 ))
            python3 tools/mutants-report.py slice --slices "$SLICES" --week "$WEEK" \
              < mutants.all > mutants.tested
            mapfile -t SLICE < mutants.tested
            if [ "${#SLICE[@]}" -gt 0 ]; then
              # The shards list exactly this, so the count and the matrix agree with them.
              cargo mutants --package purlis-core "${SLICE[@]/#/--file=}" --list > mutants.run
            else
              : > mutants.run
            fi
            WHY="of slice $(( WEEK % SLICES + 1 )) of $SLICES: ${#SLICE[@]} files, from $(head -n1 mutants.tested) to $(tail -n1 mutants.tested)"
          else
            WHY="${WHY:-of the whole crate}"
            cp mutants.all mutants.run
            cp mutants.files mutants.tested
          fi
          COUNT="$(wc -l < mutants.run)"

          SHARDS=$(( (COUNT + PER_SHARD - 1) / PER_SHARD ))
          if [ "$COUNT" -eq 0 ]; then
            SCOPE="none"
          fi
          {
            echo "scope=$SCOPE"
            echo "shards=$SHARDS"
            echo "matrix=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $COUNT mutants, $SHARDS shards"
            echo
            echo "A **$SCOPE** run: the mutants $WHY."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-diff
          path: |
            mutants.diff
            mutants.tested
            mutants.files
          if-no-files-found: error

  baseline:
    name: purlis-core's own tests
    needs: plan
    if: needs.plan.outputs.scope != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bubblewrap and socat, as `ci.yml` installs them: a project charter makes runs its chats
      # sandboxed (ADR 0067 §1), so purlis-core's start tests refuse without them. On a shard
      # their absence is worse than a red baseline: every mutant those tests cover reads as
      # caught, by a test that fails whatever the mutant does.
      - name: The sandbox's programs
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every crate the workspace's lock names, and not only purlis-core's: the gitoxide
      # guard reads `cargo metadata --offline` over the whole workspace, which a
      # `--package purlis-core` build never downloads.
      - name: Every crate the lock names
        run: cargo fetch --locked
      # Exactly what cargo-mutants runs as its baseline, and the reason the shards below can
      # skip it. `--no-fail-fast` for `ci.yml`'s reason: cargo stops at the first failing test
      # binary and skips every later one, so a single flake would hide the rest.
      - name: The unmutated tree, once, for every shard
        run: cargo test --package purlis-core --profile mutants --locked --no-fail-fast

  core:
    name: shard ${{ matrix.shard }}
    needs: [plan, baseline]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # EIGHT AT A TIME, and this is the line that matters to everyone else. GitHub runs at
      # most twenty jobs at once across the whole account, and diazoxide/charter-plane shares that
      # ceiling with this repo. Unbounded, the 24 shards of 2026-09-23 took every slot there
      # was and PR CI in both repos queued behind them for hours — a nightly that nobody reads
      # until the afternoon must not hold the morning's merges. Eight leaves twelve for PRs.
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-diff
      # bubblewrap and socat, as `ci.yml` installs them: a project charter makes runs its chats
      # sandboxed (ADR 0067 §1), so purlis-core's start tests refuse without them. On a shard
      # their absence is worse than a red baseline: every mutant those tests cover reads as
      # caught, by a test that fails whatever the mutant does.
      - name: The sandbox's programs
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every crate the workspace's lock names, and not only purlis-core's: the gitoxide
      # guard reads `cargo metadata --offline` over the whole workspace, which a
      # `--package purlis-core` build never downloads.
      - name: Every crate the lock names
        run: cargo fetch --locked
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-mutants@${{ env.MUTANTS_VERSION }}
      # `timeout-minutes` on the STEP and not the job, so that when the budget is exceeded the
      # verdict step below still runs and says how far the shard got. A job-level timeout kills
      # the whole job, artifact and all, and leaves exactly the silence this file is about —
      # which is what GitHub's own 6 h cap did to three shards on 2026-09-21.
      #
      # `continue-on-error` for the same reason: the run overrunning is not this step's verdict
      # to give. The next step gives it, from what was actually written.
      #
      # `--sharding round-robin`: with the default contiguous slices, shard 1 averaged 45.7 s
      # a mutant and shard 3 averaged 29.8 s purely because of which files they inherited —
      # 53% apart, which is most of the headroom. Round-robin gives every shard the same mix.
      #
      # `--timeout` and `--build-timeout` are explicit because `--baseline skip` removes the
      # measurement cargo-mutants would otherwise derive them from. 150 s against the longest
      # test phase of any mutant that did not time out: 64.5 s on 2026-09-23 and 96.5 s on
      # 09-22, both with the 30 s git wait the suite no longer has. It was 300 s, and every
      # TIMEOUT mutant — an infinite loop, which no timeout ends sooner — paid all of it.
      # 240 s since 2026-09-25, when the whole suite took 119-146 s. At 150 s the three shards
      # that drew faster runners reported 131 MISSED and 1 TIMEOUT, and the ten that drew slower
      # ones reported 0 MISSED and 432 TIMEOUTs: the suite still running at the limit, not hangs.
      # A mutant cut off before the last test binary is not even known to survive. The limit
      # has to sit clearly above the whole suite, or TIMEOUT means nothing.
      #
      # `--in-diff` on a `diff` run only; on a full run `plan` leaves `mutants.diff` empty and
      # it is not passed, because cargo-mutants reads an empty diff as "nothing to test". A
      # `slice` run names its files, exactly as `plan` listed them.
      - name: cargo mutants
        timeout-minutes: 300
        continue-on-error: true
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          set -euo pipefail
          WHICH=()
          case "$SCOPE" in
            diff) WHICH=(--in-diff mutants.diff) ;;
            slice)
              mapfile -t SLICE < mutants.tested
              WHICH=("${SLICE[@]/#/--file=}")
              ;;
          esac
          cargo mutants \
            --package purlis-core \
            --shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} \
            --sharding round-robin \
            --baseline skip \
            --timeout ${{ env.MUTANT_TIMEOUT }} \
            --build-timeout 900 \
            "${WHICH[@]}"
      # `always()`, so this runs after a timeout, after a crash, and after a clean run. It is
      # the only thing that turns a killed step into a sentence.
      - name: What this shard actually finished
        if: always()
        run: >
          python3 tools/mutants-report.py shard
          --output mutants.out
          --shard ${{ matrix.shard }}
          --verdict verdict-${{ matrix.shard }}.json
      - name: Keep the whole run, survivors and diffs included
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-${{ matrix.shard }}
          path: |
            mutants.out
            verdict-${{ matrix.shard }}.json
          if-no-files-found: warn

  survivors:
    # THE job to read. Red here means purlis-core contains a change that no test notices.
    # It is deliberately separate from `core` so that the two sentences cannot be confused,
    # and `always()` so that survivors found by the shards that DID finish are reported even
    # when another shard died.
    name: survivors
    needs: [plan, core]
    if: always() && needs.plan.outputs.scope != 'none' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: mutants-*
      # Red for what is NEW, not for what is known. purlis-core had 141 survivors in the 38%
      # of itself that ran on 2026-09-21, and a 5% sample on 09-22 found 31 more; a job that fails on any survivor at all would be red
      # every night from here to the end of the backlog, which is the disease and not the cure.
      # `.github/mutants-survivors.txt` is the backlog, and it is a file people edit on purpose.
      - name: Every NEW survivor, in one table
        run: >
          python3 tools/mutants-report.py gather
          --verdicts artifacts
          --shards ${{ needs.plan.outputs.shards }}
          --known .github/mutants-survivors.txt
          --write-current mutants-survivors.current.txt
          --timeout ${{ env.MUTANT_TIMEOUT }}
          ${{ needs.plan.outputs.scope != 'full' && '--partial' || '' }}
      # Always, and especially when the step above went red: this is the file you copy over
      # `.github/mutants-survivors.txt` once you have decided the new entries are acceptable.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-survivors-current
          path: mutants-survivors.current.txt
          if-no-files-found: warn

  notice:
    # The part that failed on 2026-09-21 was not the testing, it was that nobody looked. A
    # scheduled workflow's red X is on a page no one opens; an issue is in the repo.
    #
    # One issue, found by its exact title among EVERY open issue, with its BODY rewritten each
    # red night — never a new issue while one is open and never a comment, so this cannot
    # become noise — and closed only when every file it holds has run clean again in a
    # scheduled slice. A dispatched run, full or not, never reaches this job. A copy filed by
    # an older version of this job is closed as a duplicate of the oldest.
    name: say so where someone will see it
    needs: [plan, baseline, core, survivors]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds `issues: write`; the checkout needs no git credentials after it.
          persist-credentials: false
      # What `plan` tested and which files the crate has. Missing when `plan` failed, and
      # `notice` then counts the whole crate as not known clean.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: plan-diff
          path: plan
      # What to say is decided by `tools/mutants-report.py notice`, which has tests; this step
      # only fetches every open issue and carries the decision out.
      - name: Open, update or close the nightly's issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN: ${{ needs.plan.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          BASELINE: ${{ needs.baseline.result }}
          CORE: ${{ needs.core.result }}
          SURVIVORS: ${{ needs.survivors.result }}
        run: |
          set -euo pipefail
          TITLE='nightly mutation testing is not clean'
          BODY_FILE="$RUNNER_TEMP/body.md"

          # EVERY open issue, every page of them. `gh issue list --limit 200` stopped at the
          # 200 newest, and once more than 200 were open the nightly's own issue was not among
          # them, so red nights filed copies (#973, #1140) instead of telling #480.
          gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request | not) | {number, title, body}' > "$RUNNER_TEMP/issues.jsonl"

          python3 tools/mutants-report.py notice \
            --title "$TITLE" --run-url "$RUN_URL" \
            --plan "$PLAN" --scope "$SCOPE" --baseline "$BASELINE" \
            --core "$CORE" --survivors "$SURVIVORS" \
            --tested plan/mutants.tested --files plan/mutants.files \
            --body-file "$BODY_FILE" \
            < "$RUNNER_TEMP/issues.jsonl" > "$RUNNER_TEMP/actions.txt"

          if [ -f "$BODY_FILE" ]; then cat "$BODY_FILE"; fi
          while read -r verb number kept; do
            case "$verb" in
              create) gh issue create --title "$TITLE" --body-file "$BODY_FILE" ;;
              edit) gh issue edit "$number" --body-file "$BODY_FILE" ;;
              close) gh issue close "$number" --comment "Every file this issue held has run clean again: $RUN_URL" ;;
              duplicate)
                gh issue close "$number" --reason "not planned" \
                  --comment "Duplicate of #$kept, which carries the nightly from now on: $RUN_URL" ;;
              *) echo "::error::unknown action from mutants-report.py notice: $verb"; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/actions.txt"
