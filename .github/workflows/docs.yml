name: docs

# purlis's website and docs, one Astro Starlight site in `site/` built from `docs/` (FR-5).
#
# On every pull request and on `main` the site is built and checked: every link inside the
# site leads to a page and a heading that exist (starlight-links-validator), every relative link
# out of `docs/` leads to a file that exists (`site/src/repo-links.mjs`), and every page in
# `docs/` is built and in the sidebar (`site/scripts/check-reachable.mjs`).
#
# Nothing is published on its own. Publishing the site is deferred by the operator's ruling V38:
# the first releases are quiet, for internal testing on the dev channel. When it is published, it
# is at https://purlis.github.io/purlis/, served from this repo (ruling V93o; the address is
# `site/src/pages.mjs`'s). The `deploy` job below is that publish, and it runs only when someone
# starts this workflow by hand on `main`, once the operator has turned Pages on for this repo
# with GitHub Actions as its source.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  # As in ci.yml: a newer push supersedes a PR's run, and every run on `main` is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: docs (build, links, reachable)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Keep the built site for the deploy job
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: docs (deploy to GitHub Pages)
    # Only by hand, only from main (V38). It fails until Pages is enabled with Actions as source.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
