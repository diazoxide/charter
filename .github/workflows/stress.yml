name: stress

# `fifty tabs` has a workflow of its own so that a pull request pays for it only when it can
# change what it measures (charter-app#147). A `paths:` filter is a WORKFLOW's, so inside
# `ci.yml` it would have skipped the nine required checks along with this one; out here it
# is GitHub's own filter on the one job it is meant for, with no action and no job of ours
# deciding it.
#
# **Since V70 a pull request does not run `fifty tabs` at all**: it is evidence only, and
# evidence-only jobs run on `main` and nightly. The filter still decides `standing`.
#
# **Every push to `main` runs it, unfiltered.** That is the record for each merge, and it is
# the backstop for everything below: a list that turns out too narrow costs a regression
# found one merge later, never one that is not found.
#
# Measured on `main` on 2026-09-23, three runs: 8–9.6 minutes on macOS and 6–7 on Ubuntu,
# about sixteen runner-minutes a run and two of the twenty concurrent jobs this account
# shares with `diazoxide/charter-plane`. It is NOT what a CI run waits for — the shell reader's
# shards finish last — so skipping it buys back slots, not wall clock: the run for #203
# started seven of its jobs three to five minutes late and took 13 minutes to its
# neighbours' 11.
#
# Not a required check, before or after this file existed — checked against branch
# protection on 2026-09-23, not assumed. A workflow that does not trigger posts no check at
# all, which is only harmless for a check nothing requires. If `fifty tabs` is ever made
# required, the filter below has to go first.
on:
  push:
    branches: [main]
  pull_request:
    # **What the run EXECUTES, not what the spec is about.** Its assertions are on the whole
    # app process — its thread count, its memory, one round's budget — so any module that
    # runs a thread, and any render that grows with fifty chats, is inside the dependency set
    # whether or not it has "tab" in its name. `PlaneView.tsx`, `actions.ts` and `fits.ts`
    # each carry a measurement at fifty tabs for that reason.
    #
    # Every doubt goes IN. A new file under a watched directory is watched by default; what
    # is left out is named one path at a time, and each says why the run cannot reach it.
    #
    # Order matters: a `!` line excludes what the lines above it matched.
    paths:
      # The job itself.
      - .github/workflows/stress.yml
      # The spec, the helpers it drives the window with, and every other scenario spec:
      # STRESS=1 adds it to the WHOLE scenario run, in the same app process, after whatever
      # the others left open. The benchmark, the state run, the Finder run, the layout run and
      # the upgrade run are other configurations this job never starts.
      - app/e2e/**
      - '!app/e2e/bench/**'
      - '!app/e2e/wdio.bench.conf.ts'
      - '!app/e2e/wdio.state.conf.ts'
      - '!app/e2e/wdio.finder.conf.ts'
      - '!app/e2e/wdio.layout.conf.ts'
      - '!app/e2e/wdio.upgrade.conf.ts'
      - '!app/e2e/upgrade.ts'
      - '!app/e2e/specs/*.state.e2e.ts'
      - '!app/e2e/specs/*.finder.e2e.ts'
      - '!app/e2e/specs/*.layout.e2e.ts'
      - '!app/e2e/specs/*.upgrade.e2e.ts'
      # The process it measures, all of it: a thread started anywhere in the app counts.
      - app/src-tauri/**
      - '!app/src-tauri/icons/**'
      - '!app/src-tauri/tauri.release.conf.json'
      # The window it drives: both strips, the picker, the ending question, the panes, and
      # what fifty chats cost to draw.
      - app/src/**
      - '!app/src/**/*.test.ts'
      - '!app/src/**/*.test.tsx'
      - '!app/src/test-setup.ts'
      - app/index.html
      - app/vite.config.ts
      - app/tsconfig.json
      - app/tsconfig.node.json
      - app/package.json
      - app/package-lock.json
      # The harness in every pane.
      - crates/fake-harness/**
      # The session lifecycle — starting, probing, the pty, reaping, the record — and the
      # rest of the core the app links.
      - crates/purlis-core/**
      - '!crates/purlis-core/tests/**'
      - '!crates/purlis-core/examples/**'
      - '!crates/purlis-core/docs/**'
      - '!crates/purlis-core/proptest-regressions/**'
      - '!crates/purlis-core/src/**/tests.rs'
      # The sixteen core modules the app crate cannot reach, by a walk of every
      # `purlis_core::` and `crate::` path from `app/src-tauri/src` on 2026-09-23: the Bash
      # guard and the readers it refuses with, which only `charter hook pretooluse` calls
      # (they have the recorded behaviour, ADR 0046), and three CLI-only verbs. A PR that
      # makes one of them reachable touches a watched file to do it.
      - '!crates/purlis-core/src/credguard.rs'
      - '!crates/purlis-core/src/curate.rs'
      - '!crates/purlis-core/src/docsrc.rs'
      - '!crates/purlis-core/src/floorguard.rs'
      - '!crates/purlis-core/src/gitconfig.rs'
      - '!crates/purlis-core/src/handoffguard.rs'
      - '!crates/purlis-core/src/heredoc.rs'
      - '!crates/purlis-core/src/leakguard.rs'
      - '!crates/purlis-core/src/livesub.rs'
      - '!crates/purlis-core/src/personacmd.rs'
      - '!crates/purlis-core/src/planeroot.rs'
      - '!crates/purlis-core/src/planeroot/**'
      - '!crates/purlis-core/src/proseguard.rs'
      - '!crates/purlis-core/src/pypath.rs'
      - '!crates/purlis-core/src/shellseg.rs'
      - '!crates/purlis-core/src/shellwrap.rs'
      - '!crates/purlis-core/src/toolgate.rs'
      # Every dependency's version and the toolchain: a tokio, portable-pty or Tauri bump
      # moves the thread count directly.
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .nvmrc
      # The shared standing job's own tests (FD-11), which the `tests.rs` line above leaves
      # out: last, so it puts back the one file the job runs.
      - crates/purlis-core/src/planegit/tests.rs
      # NOT `crates/purlis-cli`. The job builds it, because other specs in the same run
      # start it, but no pane in this spec does: `writeShell` starts the fake harness with
      # no `--hook`, and the fake harness runs no `statusLine`. A purlis-cli that does not
      # compile is the required `rust` job's red, not this one's.
  # Nightly, for `fifty tabs`, which no pull request runs any more (V70, as in `ci.yml`).
  schedule:
    - cron: "41 2 * * *"

concurrency:
  group: stress-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # `ci.yml`'s reason: a PR's newest push supersedes the last, and a merge's run on `main` is
  # the only record that commit gets.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  stress:
    # Evidence for charter-app#16, not a gate: fifty tabs on a shared runner is timing-bound,
    # and a flaky REQUIRED check blocks every merge — including the fix for the bug it watches.
    # It reports, and it is allowed to fail. charter-app#147 says what a red run means now.
    #
    # It was red on five of its last six runs on `main` (2026-09-20) and that was NOT the
    # timing this comment allows for: the spec asked for a 900 s budget in the first line of
    # its body, where WebdriverIO has already read the old one, so it silently ran under
    # `mochaOpts.timeout` — 180 s — against a macOS runner that needs 170–218 s. The budget
    # decided the result and the app never did. `stress.e2e.ts` carries the measurement and
    # `e2e/budget.test.ts` keeps the budget where WebdriverIO reads it.
    #
    # A job red five times in six is not evidence of anything; it teaches the repo to ignore
    # a red X. If this one goes red again, read `logs/stress.jsonl` in the artifact below
    # before assuming the runner: it now records the app's memory, threads, descriptors (on
    # macOS too, since SC-15) and session count every ten tabs, so a run that stops says which
    # tab it stopped on. STRESS=1 also starts the app under launchd's open-file limit
    # (`launchedUnderLaunchdsLimit` in `e2e/harness.ts`).
    name: fifty tabs, then two hundred (${{ matrix.os }}, evidence only)
    # Evidence only, so on `main` and nightly, never on a pull request (V70, as in `ci.yml`).
    # The `paths:` filter above now decides only whether a pull request runs `standing`.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bubblewrap and socat: Claude Code's Linux sandbox runs through them (ADR 0067 §1).
      - name: Tauri's Linux build dependencies, a display to run in, and the sandbox's programs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11 bubblewrap socat
      - uses: ./.github/actions/rust-toolchain
      # Only `main` saves a Rust cache; a pull request restores `main`'s and saves none.
      # The repository holds 10 GB of caches, and each pull request's own 0.8-1.2 GB ones
      # pushed `main`'s out: on 2026-10-08 the caches held 12 GB and a run on `main` started
      # with none (the rust-cache README's own advice for a busy repository).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: The harness the scenario tests run in every pane, and the binary its hooks run
        run: cargo build -p fake-harness -p purlis-cli
      # The `e2e` feature puts WebdriverIO's embedded WebDriver server inside the app, which is
      # what drives it on macOS as well as Linux. It is in no build anyone is given.
      - name: Build the app for the scenario tests
        run: npx tauri build --debug --no-bundle --features e2e --config src-tauri/tauri.e2e.conf.json
        working-directory: app
      - run: npm run e2e
        if: runner.os == 'macOS'
        working-directory: app
        env:
          STRESS: "1"
          # The app says how far its launch got (#23). A stress run that loses the app has to
          # be able to tell a launch that never finished from one that did and then died.
          CHARTER_LAUNCH_LOG: "1"
      - run: xvfb-run -a npm run e2e
        if: runner.os == 'Linux'
        working-directory: app
        env:
          CHARTER_LAUNCH_LOG: "1"
          STRESS: "1"
      # `always()`, not `failure()`: this job's whole output is the numbers, and the run that
      # SUCCEEDED is the one that says what healthy costs. The comment at the top of this job
      # claimed the logs were kept either way and nothing kept them — the console scrollback
      # was all there was, and it does not survive a log rotation.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-logs-${{ matrix.os }}
          path: app/logs
          if-no-files-found: warn

  standing:
    # FD-11 (#651): the shared standing at the ticket's monorepo size. A plane of 300,000
    # committed files, where one standing takes seconds — long enough that pollers asking for
    # themselves overlap, which the control test shows they do, and the shared standing's test
    # shows they no longer do: one git process in the repo at a time, and eight reads costing
    # no more git than one. The same two tests run at 2,000 files in every `cargo test`.
    name: shared standing at 300,000 files
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Pollers at once on a 300,000-file plane, with and without the shared standing
        run: cargo test -p purlis-core --lib -- planegit::tests::pollers_at_once --test-threads 1 --nocapture
        env:
          CHARTER_STANDING_FILES: "300000"

  search-at-scale:
    # FM-12 (#1115): ⌘P, ⌘⇧F and a branch's status on generated repos of 100,000 and 300,000
    # files, held to `docs/spec.md`'s rows G2–G4 (ADR 0086 L1's 50 ms for a ⌘P keystroke). It
    # is the evidence behind V86 F9's "no index until a measurement shows the need" and #1153's
    # index question, so a regression that would reopen either shows on `main` the day it lands.
    # Evidence only (V70): `main` and nightly, never a pull request. **It reports its budgets
    # and does not fail for one** (ADR 0086, amended 2026-10-04): G2–G4 are timings, which §1
    # keeps out of CI's absolute rows, and a failing evidence job still turns the commit red,
    # `continue-on-error` or not. GitHub's macOS runners missed them on every main run since
    # the job was added (a first ⌘P find of 8–12 s, the operator's machine's 0.2–1.7 s) while the
    # same code met them on Ubuntu. So the test runs with `CHARTER_MEASURE_BUDGETS=report`:
    # each miss is a warning, every number goes to the job summary and to an artifact, and the
    # budgets fail the run by hand on the operator's machine. A run that breaks — a wrong
    # answer, a panic — still fails.
    name: search at scale (${{ matrix.os }}, ${{ matrix.files }} files, evidence only)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    continue-on-error: true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        files: ["100000", "300000"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `shell: bash` for `pipefail`, so the test's own failure is the step's.
      - name: ⌘P, ⌘⇧F and status on a generated repo
        shell: bash
        run: cargo test --release -p purlis-core --test search_is_measured_on_large_repos -- --ignored --nocapture --test-threads=1 2>&1 | tee fm-12.log
        env:
          CHARTER_MEASURE_FILES: ${{ matrix.files }}
          CHARTER_MEASURE_BUDGETS: report
      - name: The numbers, and each budget missed, in the job summary
        if: always()
        shell: bash
        env:
          WHERE: ${{ matrix.os }}, ${{ matrix.files }} files
        run: |
          touch fm-12.log
          # grep finds nothing on a run that met every budget; under pipefail that
          # exit 1 must not fail the step.
          { grep -o 'FM-12 | budget missed | .*' fm-12.log || true; } | while IFS= read -r line; do
            echo "::warning title=FM-12 budget (${WHERE})::${line}"
          done
          {
            echo "### Search at scale (${WHERE})"
            echo
            echo 'Evidence only: a budget missed here is reported, not failed (ADR 0086).'
            echo
            echo '```text'
            grep -o 'FM-12 | .*' fm-12.log || echo 'no measurements: the run stopped before any'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-at-scale-${{ matrix.os }}-${{ matrix.files }}
          path: fm-12.log
          if-no-files-found: warn
