name: Bug report
description: Something charter does that it shouldn't, or doesn't do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if the plugin's guard **denied** a command (an SSH URL, `--gpg-sign`,
        `--reveal`, `cat`-ing a vault file), that is usually the rule working as intended —
        see [docs/git-policy.md](../../blob/main/docs/git-policy.md). File it anyway if the
        message was wrong or unhelpful.

        Anything security-sensitive belongs in a private report, not here — see
        [SECURITY.md](../../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what charter did.
      placeholder: |
        $ charter clone billing-api
        ✗ ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: charter doctor
      description: >
        Output of `charter doctor`. It answers most of the first round of questions —
        python, git, git identity, forge CLI and auth. Redact anything private.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: charter version
      description: Output of `charter version`. If the plugin is involved, its version too.
      placeholder: "0.27.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true
