# The "New issue" chooser. Questions and ideas go to Discussions, security reports go private,
# and every issue starts from one of the forms beside this file (FR-14, #609).
blank_issues_enabled: false
contact_links:
  - name: Ask a question
    url: https://github.com/purlis/purlis/discussions/categories/q-a
    about: How do I…? Why did purlis…? Ask in Discussions, where the answer helps the next person too.
  - name: Suggest an idea
    url: https://github.com/purlis/purlis/discussions/categories/ideas
    about: A feature or a change that is not settled yet starts as an idea in Discussions.
  - name: Report a security vulnerability
    url: https://github.com/purlis/purlis/security/advisories/new
    about: Never in a public issue. Report it privately, as SECURITY.md describes.
