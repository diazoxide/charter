name: Feature request
description: Something charter should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong often enough that you want this
      description: >
        The concrete situation, not the proposed feature. charter's existing commands each
        came from something that actually kept happening — describing yours the same way is
        the fastest route to the right design.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: The workaround, however ugly.
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What you think it should look like
      description: A command, a flag, a config key — a guess is fine, and so is "no idea".
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I've looked at `docs/` and this isn't already possible
          required: true
        - label: I've checked `docs/adr/` in case this was decided against on purpose
          required: false
