name: A tmux whose server reaps its children
description: Build and install tmux 3.5a, and refuse the job if what lands on PATH is older.

# **`ubuntu-latest` ships tmux 3.4, and tmux 3.4 loses SIGCHLD.** This action exists to
# keep charter's real-tmux tests off it. Read this before "simplifying" it away — the
# mechanism is in tmux's own source and the rates below are measured on this repository's
# runners, not estimated.
#
# **The mechanism.** Killing a pane's process gives the server the pty EOF, which runs
# `server_destroy_pane` and closes `wp->fd` — and `wp->fd` is the whole of
# `#{pane_dead}`. That function then RETURNS at `server-fn.c:329`, on
# `remain_on_exit != 0 && (~wp->flags & PANE_STATUSREADY)`, **before**
# `notify_pane("pane-died")`. `PANE_STATUSREADY` is set only by `server_child_exited`,
# which runs off SIGCHLD. So when the SIGCHLD is lost the pane reads `#{pane_dead}` = 1
# with `#{pane_dead_status}` and `#{pane_dead_signal}` BOTH EMPTY, and the `pane-died`
# hook never fires at all. charter drives its whole ended-tab presentation off that hook.
#
# **The rates.** Measured with charter stripped out entirely — one tmux server,
# `remain-on-exit on`, a `sleep 300` pane, one `pane-died` hook, SIGKILL the pane's pid:
#
#   * tmux 3.4 — 8 misses in 60, and on the same image and libevent 5 misses in 40.
#   * tmux 3.5 — 0 misses in 40, same image, same libevent, same script.
#
# And charter's own gate test, `AnExitOnARealServer.test_a_signal_death_ends_the_tab`:
# tmux 3.4 — 5 misses in 30; tmux 3.5 — 0 in 30. That test has failed on `main` and on
# two pull requests, across `test (3.12)`, `(3.13)` and `(3.14)`, and three deletion-sweep
# shards refused their whole slice with "the baseline is red" because of it. See #1116.
#
# **Which is why this is a version pin and not a retry, a longer bound, or a skip.** The
# test is correct and the bound is not the variable: on 3.4 the event charter waits for is
# never emitted, so no amount of patience reaches it, and a suite that waits longer for a
# thing that will never arrive is slower and exactly as red.
#
# **Built from the release tarball rather than installed from a package**, because there
# is no package: `noble`'s tmux is 3.4-1build1, a newer distro's `.deb` is built against a
# different libevent, and a third-party prebuilt binary is a supply-chain step this
# repository declines elsewhere for the same reason (`test.yml`'s `dev-install` note). The
# tarball is the tmux project's own release asset and it is content-addressed below, so
# the build is reproducible without trusting anything that can move.

runs:
  using: composite
  steps:
    - name: Build and install tmux, from a tarball pinned by content
      shell: bash
      env:
        # 3.5a and not something newer, deliberately: 3.5 is the version the miss rate was
        # MEASURED at zero on, and `a` is that release's own patch level. Moving this is
        # fine — the floor below is what must hold — but move it to something somebody has
        # run the repro against, and say so here.
        TMUX_VERSION: 3.5a
        # `sha256sum -c` refuses on a mismatch, so a moved or replaced asset stops the job
        # instead of silently installing something else. Recorded 2026-09-17 from the
        # tmux project's own GitHub release asset.
        TMUX_SHA256: 16216bd0877170dfcc64157085ba9013610b12b082548c7c9542cc0103198951
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          --no-install-recommends libevent-dev libncurses-dev bison pkg-config
        work="$(mktemp -d)"
        curl -fsSL --retry 3 --retry-all-errors -o "$work/tmux.tar.gz" \
          "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
        printf '%s  %s\n' "$TMUX_SHA256" "$work/tmux.tar.gz" | sha256sum -c -
        tar -xzf "$work/tmux.tar.gz" -C "$work"
        cd "$work/tmux-$TMUX_VERSION"
        ./configure --prefix=/usr/local >/dev/null
        make -j"$(nproc)" >/dev/null
        sudo make install >/dev/null
        # **One tmux on the machine, not two.** `/usr/local/bin` precedes `/usr/bin` on
        # this image, so the build above already wins — but PATH is not this action's to
        # control, every later step gets a fresh shell, and the failure mode of losing
        # that race is a flake rather than an error. Removing the distro's 3.4 means
        # anything that resolves `tmux` at all resolves this one. Non-fatal on purpose:
        # an image that never had the package is not a problem, and the step below is the
        # gate either way.
        sudo apt-get remove -y -qq tmux || true
        hash -r

    - name: The tmux this job will actually run is at or above the floor
      shell: bash
      env:
        # The floor, and NOT the version installed above: the pin may legitimately move
        # ahead of it, and what must never happen is the runner dropping below it. Held to
        # `tests/test_ci_runs_a_tmux_that_reaps_its_children.CI_TMUX_FLOOR` by that
        # module, so this number and the suite's cannot drift apart.
        FLOOR_MAJOR: 3
        FLOOR_MINOR: 5
      run: |
        set -euo pipefail
        # **A separate step from the build, and that is the point of it.** A silent
        # downgrade — the build step edited, a PATH this action does not own, an image
        # that ships its own newer-looking tmux — must fail HERE, loudly, naming the bug.
        # The alternative is what this repository already lived through: the suite runs on
        # 3.4, the gate test misses about one run in six, and the red reads as "the runner
        # was busy" rather than as "this tmux cannot tell charter its harness died".
        said="$(tmux -V)"
        printf 'tmux on this runner: %s\n' "$said"
        read -r major minor <<<"$(printf '%s\n' "$said" \
          | sed -n 's/^tmux \([0-9][0-9]*\)\.\([0-9][0-9]*\).*$/\1 \2/p')"
        if [ -z "${major:-}" ]; then
          echo "::error::could not read a version out of \`tmux -V\` (\`$said\`). charter's" \
               "real-tmux tests need tmux >= $FLOOR_MAJOR.$FLOOR_MINOR and this job cannot" \
               "tell whether it has one."
          exit 1
        fi
        if [ "$major" -lt "$FLOOR_MAJOR" ] \
           || { [ "$major" -eq "$FLOOR_MAJOR" ] && [ "$minor" -lt "$FLOOR_MINOR" ]; }; then
          echo "::error::this runner has $said, below the tmux" \
               "$FLOOR_MAJOR.$FLOOR_MINOR floor. Below it the server can lose a SIGCHLD," \
               "destroy the pane WITHOUT firing \`pane-died\`, and leave" \
               "\`#{pane_dead_status}\` and \`#{pane_dead_signal}\` both empty — measured" \
               "at 8 misses in 60 on 3.4 and 0 in 40 on 3.5 (#1116). The suite would not" \
               "fail cleanly on that; it would flake. Fix the install in" \
               ".github/actions/tmux/action.yml rather than lowering this floor."
          exit 1
        fi
