[package]
name = "purlis-app"
version.workspace = true
description = "charter, the desktop app"
authors = ["Aaron Yordanyan"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "purlis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The app's program keeps its name: the keyring writer (`secrets::keyhold::APP_BINARY`), the
# e2e runs and the release steps find it by it. Renaming the program is not the crate's rename.
[[bin]]
name = "charter-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
purlis-core.workspace = true
# A file tab's image preview crosses to the window as base64 (FM-2).
base64 = "0.23"
# About Charter: the running version's section of the repository's CHANGELOG.md.
changelog.workspace = true
# `wscmd::create` is handed the moment the workspace was made, because `charter workspace
# create` stamps it into the manifest and the two implementations must stamp the same field.
# The same spelling `purlis-cli` uses, so one version of chrono is in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2"
# The one dialog shown before Tauri is built (`refuse_beside_the_old_app`): the native dialog
# the dialog plugin itself draws through, at the version it already brings in.
rfd = { version = "0.17", default-features = false }
# The app moving itself (ADR 0042). Its signature check is an ordinary dependency
# of the plugin, not a feature, so there is no build of it that skips verification.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "rt"] }
# What the app notices goes to the diagnostic log `purlis_core::applog` installs (#647): a
# file that rotates daily, and standard error. The version purlis-core uses.
tracing = "0.1"
# A file row's Copy absolute path (FM-10) says a Windows path without the `\\?\` prefix
# `canonicalize` gives it. The version tauri-plugin-opener already brings in.
dunce = "1.0.5"
# A vault's Copy (charter-app#236): the core puts the value on the system clipboard itself, so
# it never reaches the window, and marks it for clipboard histories to leave out. Text only.
arboard = { version = "3.6.1", default-features = false }
# What that Copy remembers instead of the value: a digest, to clear the clipboard a minute later
# only while it still holds what was copied. The version purlis-core already uses.
sha2 = "0.11"
# The plane changing under the window (charter-app#264): the todos a terminal closed, a workspace
# another process made. notify is the standard cross-platform watcher (FSEvents, inotify,
# ReadDirectoryChangesW). Its events are folded into bursts by hand (`watchset.rs`), not by
# notify-debouncer-full, which drops a file made and removed inside one fold (#1139).
notify = "8.2"

# The desktop portal, asked on the session bus before GTK asks it (charter-app#24,
# `portal.rs`). The version `tauri-plugin-single-instance` already brings in on Linux, so
# nothing new is in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
# rfd's GTK backend on Linux, as the dialog plugin enables it.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
zbus = "5.19"
# Whose charter the instance lock is (`instance.rs`), by user id. The version purlis-core
# already uses.
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true

[features]
# What a scenario test needs inside the app: WebdriverIO's embedded WebDriver server, and its
# plugin for running code in the window. Never in a build anyone is given.
#
# It carries the plane fence too, and that half is not about WebDriver. The scenario run
# starts this binary from a checkout that sits inside the operator's own plane, so a config
# that forgets to pin `$CHARTER_ROOT` resolves that plane and records into it — which is
# charter-app#129. A fenced app dies at the first touch instead of quietly succeeding.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "purlis-core/fenced"]

[dev-dependencies]
# Tauri's mock runtime, to invoke commands through the app's real ACL (`ipc.rs`, ADR 0052).
tauri = { version = "2", features = ["test", "tray-icon"] }
# Fenced for `cargo test --workspace`, which is the invocation that compiles and runs this
# crate's tests — and the one named in charter-app#129.
purlis-core = { workspace = true, features = ["fenced", "test-support"] }
stand-in.workspace = true
# The UI RPC's list of commands no link serves (`session_protocol::ui::WINDOW_ONLY`, HP-6), so
# the client generated for the link leaves out the same ones.
purlis-session-protocol = { path = "../../crates/session-protocol" }
tempfile.workspace = true
# A vault's clipboard clear is tested on tokio's paused clock, not a real minute.
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
