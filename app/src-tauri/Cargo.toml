[package]
name = "charter-app"
version.workspace = true
description = "charter, the desktop app"
authors = ["Aaron Yordanyan"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "charter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
charter-core.workspace = true
# `wscmd::create` is handed the moment the workspace was made, because `charter workspace
# create` stamps it into the manifest and the two implementations must stamp the same field.
# The same spelling `charter-cli` uses, so one version of chrono is in the tree.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-dialog = "2"
# The app moving itself (charter ADR 0042). Its signature check is an ordinary dependency
# of the plugin, not a feature, so there is no build of it that skips verification.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[lints]
workspace = true

[features]
# What a scenario test needs inside the app: WebdriverIO's embedded WebDriver server, and its
# plugin for running code in the window. Never in a build anyone is given.
#
# It carries the plane fence too, and that half is not about WebDriver. The scenario run
# starts this binary from a checkout that sits inside the operator's own plane, so a config
# that forgets to pin `$CHARTER_ROOT` resolves that plane and records into it — which is
# charter-app#129. A fenced app dies at the first touch instead of quietly succeeding.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "charter-core/fenced"]

[dev-dependencies]
# Fenced for `cargo test --workspace`, which is the invocation that compiles and runs this
# crate's tests — and the one named in charter-app#129.
charter-core = { workspace = true, features = ["fenced"] }
stand-in.workspace = true
tempfile.workspace = true
