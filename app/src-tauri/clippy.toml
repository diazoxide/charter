# The app is the process that actually opens terminals, so the same rule as
# `crates/purlis-core/clippy.toml` holds here: every fork goes through
# `purlis_core::forklock`, or a child inherits a chat's terminal for as long as it lives
# (charter-app#53). Repeated rather than inherited because clippy reads ONE configuration
# file — the first it finds walking up from the crate — and never merges two.
disallowed-methods = [
  { path = "std::process::Command::spawn", reason = "use purlis_core::forklock::spawn — charter-app#53" },
  { path = "std::process::Command::output", reason = "use purlis_core::forklock::output — charter-app#53" },
  { path = "std::process::Command::status", reason = "use purlis_core::forklock::status — charter-app#53" },
]

# A diagnostic goes through `tracing`, to the log `purlis_core::applog` installs (#647): the app
# started from the Dock or a desktop launcher has a standard error nobody reads. Repeated from
# `crates/purlis-core/clippy.toml` for the reason above.
disallowed-macros = [
  { path = "std::eprintln", reason = "a diagnostic goes through tracing (purlis_core::applog, #647)" },
  { path = "std::eprint", reason = "a diagnostic goes through tracing (purlis_core::applog, #647)" },
]
