schema = 1

[[forge]]
kind = "github"
owner = "diazoxide"

[memory]
share = "local"

[persona]
default = "steward"

[frame]
# Every slot: identity across the top, the one-row attention strip under it, the wide
# repo table below that, persona chips down the right. `right` needs a terminal at least
# `min-cols` wide — below that `layout.visible_slots` drops it rather than cramping the
# harness. `repos` is dropped the same way once its own pane would be narrower than the
# 95 columns the table needs, because a `repos` pane too narrow to draw one is a bordered
# rectangle that reads as "this workspace has no repos" (#515).
#
# `repos` carries the table as of #515; before that `bottom` carried the attention row
# and the table stacked in one pane. This line has to NAME it: `slots` is the primitive
# and an explicit list wins over the default outright, so a list without `repos` launches
# fine and simply draws no table.
#
# The ORDER is the geometry (#488): `repos` is split before `right`, so its table gets
# the full window width — measured drawn at 95 columns and up. Listed after it, `repos`
# is split off a harness the sidebar has already narrowed — 23 columns short of the
# window, so the table needs a 118-column terminal before it is drawn at all, and below
# that the slot is dropped and the harness keeps the rows (#500). There is no `left` any
# more — it drew a 22-column copy of the rows `repos` now draws at full width.
slots = ["top", "bottom", "repos", "right"]

# This plane opts into the pointer. `false` is the shipped default and stays that way for
# the reason `docs/frame.md` gives an operator: turning it on makes tmux ask the terminal
# to report the mouse from attach, and from that moment the terminal's OWN drag-select
# stops working inside this window — you get tmux's copy-mode selection instead. That is a
# real cost and it is not charter's to impose on a stranger's plane.
#
# It is this plane's own file, and this plane's operator asked for the repo table to be
# scrollable and clickable — which is what the flag buys. With it off, tmux asks the
# terminal to report from the ACTIVE pane's request alone, so with the harness active
# nothing has asked, no bytes are sent, and a click on the `repos` pane is not an event
# charter drops but an event that never happens (`frame/events.py` measures both regimes).
# The panel's own declaration is not enough on its own and was never meant to be.
#
# What it does NOT cost, since #634: the keyboard. tmux's default `MouseDown1Pane` selects
# the pane under the pointer before forwarding, so `mouse = true` used to move the harness
# focus onto whatever you clicked; charter rebinds that key to forward without selecting
# for panes it marked as panels, and to leave tmux's own two commands alone for everything
# else. Measured on 3.7c and at the 3.2 floor. So clicking a repo row selects the row and
# leaves you typing where you were.
#
# The selection has a keyboard route as well and always will: `F2` → `repo: select the
# next row`. A pointer affordance with no key is a feature most planes cannot reach.
mouse = true

# This plane opts into the pane surface. `off` is the shipped default and stays that way:
# charter cannot detect a terminal's theme (OSC 11 through tmux answers nothing, and
# `$COLORTERM` inside a pane describes the terminal that started the SERVER, not the one
# looking at the pane), so no colour is right on both themes and a default that repaints a
# stranger's terminal can make an upgraded frame worse for them. This file is not a
# stranger's — it is this plane's own, and this plane's operator asked for the look. Same
# posture and same recorded reason as `[frame] mouse`: `FRAME_DEFAULTS` says what a plane
# looks like before anybody has said anything, and this line says what THIS one looks
# like. Three words: `off`, `dark`, `light`.
chrome = "dark"

# The arrangement, written out. `[[frame.component]]` supersedes `slots` above when it is
# usable, and each table keeps its component's SHIPPED rectangle — omitting `edge`/`size`
# is what asks for the default rather than overriding it. An arrangement is refused WHOLE
# (#535): one value charter cannot read drops all four tables back to `slots`, because a
# frame with one panel silently missing reads as a plane with no clones.
#
# `bg` is a WORD, never a style string — a tmux style value is format-expanded, so the
# word is only ever a key into `FRAME_PANE_BG` and the value handed to tmux is charter's
# own constant. Seventeen words: `default`, the eight ANSI names, their eight `bright`
# forms. Sixteen names and not 256 is a decision: a committed `bg` is read on a machine
# whose theme its author never saw, so it resolves against the OPERATOR's palette.
#
# Every pane charter draws is `brightblack` and the harness pane is left alone, which is
# the whole look: charter's chrome is grey, the work area is the terminal's own. The pair
# inverts on focus (`brightblack` active is `black`), so the focused panel is the one that
# differs from its neighbours rather than the one that lights up.
#
# `pad` is horizontal only and comes OUT of the content budget, not on top of it: a
# renderer composes narrower rather than composing wide and being pushed off its own edge.
# Pinned as an equality — a 120-column `repos` at `pad = 2` composes byte-identical rows
# to a 116-column one with none. `FRAME_PANE_PAD_MAX` is 5, derived as the largest inset
# the 22-column sidebar can afford.
#
# ORDER IS THE GEOMETRY (#488/#500), and it is the same rule the `slots` list above
# carries: `repos` is split BEFORE `sidebar`, so its table gets the full window width and
# draws from 95 columns up. Reversed, it is split off a harness the sidebar has already
# narrowed and needs 118 columns before it is drawn at all. `test_frame_config` asserts
# this plane's committed order against what the geometry wants — it caught the reversal.
#
# `key` toggles that one component live. `F2` (palette) and `F12` (escape hatch) are
# refused by name — measured: a component could otherwise take `F12` and tmux would read
# back one binding with the operator's silently gone.

[[frame.component]]
use = "identity"
bg  = "brightblack"
pad = 1
key = "F5"

# The two tab strips, between the identity row and the work area: what plane, then
# which workspace, then which chat inside it. Split order is the geometry (#488).
#
# Neither ships placed (`instance.FRAME_SLOTS`) and that is deliberate — a plane with one
# chat is the ordinary permanent state, and each costs a row, a ~24 MB process and about
# seven of every switch's tmux calls. This plane opts in because its operator wants them.
#
# `workspaces` draws `switch.workspaces()` — EVERY directory under `workspaces/`, with the
# current one marked. It is a listing, not a project switcher, and it stays one until open
# and live are real states (the IDE spec, 4c). Placed here anyway at the operator's
# request, with that limit stated rather than discovered.
[[frame.component]]
use  = "workspaces"
edge = "top"
size = 1
bg   = "brightblack"
pad  = 1

[[frame.component]]
use  = "chats"
edge = "top"
size = 1
bg   = "brightblack"
pad  = 1

[[frame.component]]
use = "attention"
bg  = "brightblack"
pad = 1
key = "F6"

[[frame.component]]
use  = "repos"
size = 15
bg   = "brightblack"
pad = 2
key = "F8"

[[frame.component]]
use = "sidebar"
bg  = "brightblack"
pad = 1
key = "F7"

[update]
# Track main instead of the last release. `charter update` installs straight from git;
# nothing is published, and PEP 610 gives `charter --version` the exact commit.
channel = "dev"
