[package]
name = "release-manifest"
version.workspace = true
description = "The updater manifest a release publishes, and the guards it has to pass first"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
charter-core.workspace = true
serde_json.workspace = true
# The verifier tauri-plugin-updater itself uses, at the version already in Cargo.lock through
# it — so what this refuses at release time is exactly what the app would refuse on a laptop.
minisign-verify = "0.2"

[dev-dependencies]
# Signing, for the tests only: each run makes a keypair in memory and throws it away, so no
# key and nothing derived from one is ever committed to this repository.
minisign = "0.9"

[lints]
workspace = true
