# The Monorepo project template. Everything else in this directory is copied into a new
# project as it is laid out here (crates/charter-core/src/template.rs). Change any file and
# `version` goes up by one.
title = "Monorepo"
summary = "Several packages or languages in one repo."
version = 1

[detect]
# A repo is this stack when one of these files is at its top level.
files = ["pnpm-workspace.yaml", "turbo.json", "nx.json", "lerna.json", "rush.json", "go.work"]

[guard]
# Commands every harness asks the operator about before a chat runs them.
ask = ["npm publish *", "pnpm publish *", "yarn npm publish *", "changeset publish *", "lerna publish *", "cargo publish *", "twine upload *", "uv publish *"]
