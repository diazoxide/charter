[package]
name = "charter-core"
description = "charter's core: the plane, its workspaces and personas, and the sessions that run harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alacritty_terminal = "0.26"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The conventional application-data directory per platform, for the one store charter keeps
# outside a plane (`machine`). Already in this workspace's lockfile — Tauri depends on it —
# so this adds no crate to the tree and no licence to review.
dirs = "6"
# The same searcher vte uses to find these sequences in the same bytes.
memchr = "2"
portable-pty = "0.9"
# The secret-shape rules are `charter/hooks.py`'s regexes, ported character for character.
regex = "1"
serde = { workspace = true, features = ["derive"] }
# `preserve_order` keeps a manifest's key order as it was read: charter rewrites a document
# it read, so a Rust writer that sorted keys would reorder the operator's file.
# `arbitrary_precision` keeps an integer beyond `u64` exact, which the default turns into an
# `f64` at PARSE time — the digest would then be taken over a number the file never held.
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
thiserror.workspace = true
toml = { version = "0.9", features = ["preserve_order"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
# A test that writes a program and then runs it goes through this and nothing else
# (charter-app#81).
stand-in.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
# `termios` is for `ttyname`: the last rung of `session.terminal()` is the controlling tty's
# device name, and `unsafe_code = "forbid"` rules out calling libc for it directly.
rustix = { version = "1", features = ["fs", "process", "termios"] }
