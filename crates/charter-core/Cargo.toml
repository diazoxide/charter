[package]
name = "charter-core"
description = "charter's core: the plane, its workspaces and personas, and the sessions that run harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alacritty_terminal = "0.26"
# The same searcher vte uses to find these sequences in the same bytes.
memchr = "2"
portable-pty = "0.9"
# `preserve_order` keeps a manifest's key order as it was read: charter rewrites a
# document it read, so a Rust writer that sorted keys would reorder the operator's file.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
thiserror.workspace = true
toml = "0.9"

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
tempfile.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }
