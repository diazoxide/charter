[package]
name = "charter-core"
description = "charter's core: the plane, its workspaces and personas, and the sessions that run harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
alacritty_terminal = "0.26"
# The same searcher vte uses to find these sequences in the same bytes.
memchr = "2"
portable-pty = "0.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
tempfile.workspace = true

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1", features = ["process"] }
