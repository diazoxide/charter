# opencode, as charter ships it (ADR 0073 §3). Read by the same reader as a project's
# `harnesses/<name>.toml`; a project may not take this name.
#
# Every fact here was measured on one version of opencode, and each is cited beside the
# `Harness` method that still answers it (`crates/charter-core/src/harness.rs`). A test holds
# the two equal until `Harness` reads them from here.
name = "opencode"
title = "opencode"
program = "opencode"
# `OPENCODE_CONFIG`, `OPENCODE_CONFIG_DIR`.
env = ["OPENCODE_*"]
login = "set XDG_DATA_HOME and run opencode auth login"
tested = "1.18.32"

[session]
# `-s` resumes a session that exists; no flag takes an id for a new one (ADR 0058).
chosen_by = "harness"
resume = ["-s", "{id}"]
named_by = ["-s", "--session", "-c", "--continue"]

[terminal]
newline = "\u001b\r"
# `[Pasted ~N lines]` at 3 lines or more, or over 150 characters.
paste_drawn_whole = { lines = 2, chars = 150 }
# It boots silently after going raw, and a paste in that silence vanished (ADR 0061).
ready_to_type = "never"

[levels]
terminal = true
# The bundled shim, loaded through OPENCODE_CONFIG_CONTENT for this session alone.
hooks = true
# Its own ACP mode, the same program (ADR 0080 §3, HP-2): protocol version 1 and `loadSession`,
# and a session that runs with `fs` and `terminal` both off, measured on 1.18.33.
acp = ["opencode", "acp"]

[capabilities]
reports_its_process = "no: opencode names no variable for the process its plugin runs under"
reports_its_start_before_the_first_prompt = "no: opencode reports its start at the first prompt"
keeps_conversations_by_directory = "no: opencode finds a session by its id from any directory"
reports_waiting = "yes"
resumes_by_id = "yes"
per_chat_plugins = "no: opencode has no switch that turns one plugin off"
