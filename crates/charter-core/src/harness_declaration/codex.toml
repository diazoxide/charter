# Codex, as charter ships it (ADR 0073 §3). Read by the same reader as a project's
# `harnesses/<name>.toml`; a project may not take this name.
#
# Every fact here was measured on one version of Codex, and each is cited beside the `Harness`
# method that still answers it (`crates/charter-core/src/harness.rs`). A test holds the two
# equal until `Harness` reads them from here.
name = "codex"
title = "Codex"
program = "codex"
# `CODEX_HOME`.
env = ["CODEX_*"]
login = "set CODEX_HOME and run codex login"
tested = "0.147.0"

[session]
# Codex names no flag to choose an id (openai/codex#14482).
chosen_by = "harness"
resume = ["resume", "{id}"]
# Subcommands rather than flags.
named_by = ["resume", "fork"]

[terminal]
newline = "\u001b\r"
# `[Pasted Content N chars]` over 1,000 characters, however many lines.
paste_drawn_whole = { chars = 1000 }
ready_to_type = "raw-and-quiet"

[levels]
terminal = true
# charter's hooks on its own `-c hooks.<Event>=` session flags.
hooks = true

[capabilities]
reports_its_process = "no: Codex names no variable for the process a hook runs under"
reports_its_start_before_the_first_prompt = "no: Codex reports its start inside the first turn"
keeps_conversations_by_directory = "no: Codex finds a session by its id from any directory"
reports_waiting = "no: Codex never says when it stops mid-turn for your approval"
resumes_by_id = "yes"
per_chat_plugins = "no: Codex has no switch that turns a plugin on for one session"
