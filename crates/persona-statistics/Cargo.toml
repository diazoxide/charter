[package]
name = "persona-statistics"
version.workspace = true
description = "The persona statistics view: charter's first extension program, and the executor's first consumer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **It links charter-core, because it is built in** (charter-app#339, ADR 0041's amendment of
# 2026-09-25). The app ships it, and it links the core's stats code so that the view and
# `charter persona stats` give the same numbers. It still speaks only the protocol — a line of
# JSON in, a line of JSON out — and is handed only what any extension is; what proves a
# stranger can meet that contract without the core is `extension-probe`, which links nothing.
[dependencies]
charter-core.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json.workspace = true

# The end-to-end tests drive this program through charter's real executor, with the fence.
[dev-dependencies]
charter-core = { workspace = true, features = ["fenced"] }
tempfile.workspace = true

[lints]
workspace = true
