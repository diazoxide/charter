[package]
name = "purlis-core"
description = "charter's core: the plane, its workspaces and personas, and the sessions that run harnesses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# A level-3 chat's ACP client (HP-2, ADR 0080 §1): the protocol's own Rust SDK, Apache-2.0. It is
# async, so a chat's protocol runs on a thread of its own under `futures`' executor, and the
# agent's pipes are made async by `blocking`'s `Unblock`; both are already in this workspace's
# lockfile through the SDK, which brings no runtime of its own.
agent-client-protocol = "2.2"
blocking = "1"
futures = "0.3"
# `charter news` prints the app's own CHANGELOG.md sections through the same parser the release
# workflow and About Charter use (#352), so the three cannot disagree about a version.
changelog.workspace = true
alacritty_terminal = "0.26"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `home_dir`, for the last rung of the config-home ladder `machine` shares with
# `charter/report.py:consent_path`. Already in this workspace's lockfile — Tauri depends on
# it — so this adds no crate to the tree and no licence to review.
dirs = "7"
# The file tab's image preview (FM-2) reads an image's declared size from its header, without
# decoding it, so a small file declaring a huge canvas is summarised rather than handed to the
# window to decode. MIT, header-only, no dependencies of its own; only the four kinds the preview
# draws.
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The same searcher vte uses to find these sequences in the same bytes.
memchr = "2"
# An extension's declared plane-write paths (charter-app#341): one segment matched as a shell
# matches it, `*` and `?`, never a leading dot. The rust-lang crate, already in this workspace's
# lockfile, so it adds no crate to the tree.
glob = "0.3"
portable-pty.workspace = true
# ⌘P's fuzzy file names (FM-7, #1110): helix's matcher, the fzf algorithm with a bonus for
# path boundaries, and no allocation per match. MPL-2.0, on deny.toml's allow-list as a
# file-level copyleft used unmodified; its dependencies, memchr and unicode-segmentation, are
# already in this workspace's lockfile.
nucleo-matcher = "0.3"
# ⌘⇧F's content search (FM-8, #1111; V86 F9): ripgrep's own crates. `ignore` walks a branch's
# folder with its .gitignore rules read in-process and never follows a link; `grep-searcher`
# and `grep-regex` match line by line, with the regex's compiled size bounded. MIT OR
# Unlicense, dual, so MIT holds; their regex, memchr and bstr are already in this lockfile.
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# The secret-shape rules are `charter/hooks.py`'s regexes, ported character for character.
regex = "1"
serde = { workspace = true, features = ["derive"] }
# `preserve_order` keeps a manifest's key order as it was read: charter rewrites a document
# it read, so a Rust writer that sorted keys would reorder the operator's file.
# `arbitrary_precision` keeps an integer beyond `u64` exact, which the default turns into an
# `f64` at PARSE time — the digest would then be taken over a number the file never held.
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
# A Unicode character's general category (HP-6): the window offers Allow only on text with no
# format character in it, read from the Unicode tables rather than a hand list. MIT/Apache-2.0,
# from unicode-rs, the authors of the unicode-* crates the tree already has.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
sha2 = "0.11"
# A branch's changes, read in-process (FM-4, D-88f): the explorer reads them by itself after
# every write an agent makes, so no git process may start in a repository whose config the agent
# can write. gitoxide reads the index, the working tree and the trees with no program run:
# `files::status` drops every `filter` and `diff` section from the config it read, and gitoxide
# has no fsmonitor, hooks or lazy fetch. MIT OR Apache-2.0. No default features: no network, no
# credential helpers, no worktree mutation. `parallel` (#1153) compares the working tree on every
# core and walks for untracked files at the same time, as `git status` does with its preloaded
# index: without it a status took about 4x git's at 100,000 files. It adds no crate the tree
# lacks.
gix = { version = "0.88", default-features = false, features = ["sha1", "status", "revision", "blob-diff", "excludes", "dirwalk", "index", "parallel"] }
# The bounded reader's memory cap (FM-4, D-88h): the child reads its own resident memory and
# stops past the cap. Portable where `setrlimit` is not (macOS refuses an address-space limit
# below what a process has already mapped). MIT OR Apache-2.0.
memory-stats = "1"
# How many cells a character takes, measured as `alacritty_terminal` measures it: the engine
# needs it to repair what inserting a character does (`engine/pane_rules.rs`). Already in this
# workspace's lockfile through `alacritty_terminal`, so it adds no crate to the tree.
unicode-width = "0.2"
# The keyed fingerprint `secret get` prints (`charter/secrets/fingerprint.py`): HMAC-SHA256 over
# `sha2`, and 32 random bytes for the plane's key. Both already in this workspace's lockfile.
hmac = "0.13"
# The `keyring` vault provider (ADR 0047): the operating system's own credential store — the
# macOS Keychain, the Secret Service on Linux, the Windows Credential Manager — through the
# standard crate every Rust program that keeps a password there uses. Its default `v1`
# feature is the one-entry API charter needs and picks the platform's store itself.
keyring = "4"
getrandom = "0.4"
# The hook channel compares a line's chat token with the one the chat was given in constant
# time (`hookwire::ChatTokens`). Already in this workspace's lockfile through `hmac`'s `digest`,
# so it adds no crate to the tree.
subtle = "2"
# `secret exec --file`/`--dotenv`: a 0600 temp file, created with a random name that cannot
# collide or be pre-planted. Already a dev-dependency here and in the lockfile.
tempfile.workspace = true
thiserror.workspace = true
toml = { version = "1.1", features = ["preserve_order"] }
# The Settings tab's writer (charter-app#252): an edit to `charter.toml` or
# `charter.local.toml` keeps every comment, blank line and key order the operator wrote. The
# version already in this workspace's lockfile, so it adds no crate to the tree.
toml_edit = "0.25"
unicode-normalization = "0.1.25"
# The diagnostic log (`applog`, #647): what the app notices and nobody asked to see goes to
# `tracing`, and from there to a file that rotates daily and to standard error. `tracing` is
# already in this workspace's lockfile through Tauri; the subscriber and the rolling appender
# are the tokio project's own, the standard pair for it. No ANSI: the file is read as text.
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# The native forge clients (ADR 0070 §3, FW-2a). `ureq` is a synchronous HTTP client with no
# runtime of its own, so a blocking core called from `charterd`'s or the app's async runtime
# cannot panic the way a blocking `reqwest` does. rustls, with the operating system's own trust
# store (a GHES behind a company CA verifies as the browser does); both are already in this
# workspace's lockfile through the app.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
# The request and response types `ureq` speaks, and the URL a token may be sent to is parsed with.
http = "1"
# GraphQL queries checked at build time against the forge's published schema, so a field the
# forge renamed fails the build and not a user (ADR 0070 §3).
graphql_client = "0.16"
# A forge token is a `SecretString`: no `Debug`, `Display` or `Serialize`, zeroized on drop
# (ADR 0070 §4); the `Bearer` header value built from it is a `Zeroizing` string. `zeroize` is
# already in this workspace's lockfile through `secrecy` and the app.
secrecy = "0.10"
zeroize = "1"
uuid = { version = "1.26.1", features = ["v4"] }
# RC-20's hand-off to your editor (`youreditor`): a file's path percent-encoded into a
# `vscode://`, `zed://` or `idea://` URL, and `$VISUAL`/`$EDITOR` split into a program and its
# arguments the way a shell splits words, with no shell. Both already in this workspace's
# lockfile, so they add no crate to the tree.
percent-encoding = "2"
shell-words = "1"
# The ids ADR 0066 gives devices, chats, runs and events: ULIDs, whose time part sorts them and
# dates an event without a timestamp field. The standard crate for them.
ulid = "3"

[features]
# The plane fence (`src/fence.rs`): a build that carries it dies rather than act on a plane
# outside the tree the run was given. **Only a test build turns it on** — every crate in this
# workspace enables it from `[dev-dependencies]`, so `cargo test` has it and no
# `cargo build --release` does — and the app's own `e2e` feature turns it on for the binary
# the scenario tests drive (charter-app#129).
fenced = []
# What a test playing a chat's hook inside the host's own process needs and nothing else may
# call (`hookwire::permission::ask_permission_of_an_admitted_host`, HP-6). Only tests turn it on.
test-support = []

[dev-dependencies]
# This crate, fenced, so purlis-core's OWN tests run under the guard as well. A
# dev-dependency on itself is how a crate turns a feature on for its tests and only its
# tests; without it the fence would be a rule every crate but this one had to keep.
purlis-core = { path = ".", features = ["fenced", "test-support"] }
# The frozen fuzz subsets under `fixtures/corpora/*-generated.jsonl.gz` are read through it.
# Test-only, and already in this workspace's lockfile (Tauri's `png` pulls it in), with the
# same default features — so it adds no crate to the tree and no licence to review.
flate2 = "1"
proptest = "1"
serde_json = { workspace = true }
# A test that writes a program and then runs it goes through this and nothing else
# (charter-app#81).
stand-in.workspace = true
tempfile.workspace = true
# The recorded forge over HTTP (ADR 0070 §7): a server the native transport's tests talk to, which
# answers only the requests a test mounted. It runs its own runtime on its own thread, so a
# synchronous test drives it through `tokio`'s `block_on`.
wiremock = "0.6"
tokio = { version = "1", features = ["rt"] }
# The token-leak test records every `log` line `ureq` and rustls write at trace level, which the
# diagnostic log does not carry. Already in this workspace's lockfile through both.
log = { version = "0.4", features = ["std"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
# `termios` is for `ttyname`: the last rung of `session.terminal()` is the controlling tty's
# device name, and the workspace denies `unsafe_code`, which rules out calling libc for it
# directly (the one exception is `executor::inherit_nothing_else`; see CLAUDE.md). `system` is
# for `uname`: the dispatch and skill logs are one file per machine, named by its host.
rustix = { version = "1", features = ["fs", "process", "stdio", "system", "termios"] }
# Whether a hook socket's peer and its directory are this user's alone (FD-6).
purlis-same-user.workspace = true
# The system calls in the executor's one audited `pre_exec` (`fcntl`, and `close_range` on
# Linux), made there because nothing that allocates may run in a forked child. Already in this
# workspace's lockfile.
libc = "0.2"
# `secret exec`'s cleanup: while a 0600 temp file exists, a terminating signal sets a flag
# instead of killing charter, so the file is removed on the way out — Python's
# `_exit_on_termination`. Already in this workspace's lockfile (alacritty_terminal uses it).
signal-hook = "0.4"
# The `charter` command blocks the termination signals for the moment a keyring item is gone
# between its delete and its new write (ruling V90a, `secrets::keyhold`), with the safe
# `pthread_sigmask`. Already in this workspace's lockfile.
nix = { version = "0.31", default-features = false, features = ["signal"] }

[target."cfg(target_os = \"macos\")".dependencies]
# Keyring items held to charter's app (ruling V90a): the helper that writes them turns the
# Keychain's dialogs off, so a write it may not make fails instead of asking, and reads the
# Keychain's own error code. Already in this workspace's lockfile through `keyring`.
security-framework = "3"
